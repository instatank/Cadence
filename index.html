    const meta = CARD_META[c];
    return el("button", {
      class: "w-full text-left py-3 px-3 rounded-sm border border-hairline mb-2 hover:bg-surface2 flex justify-between items-center",
      onClick: () => { setTodayCardType(c); backdrop.remove(); render(); }
    }, [
      el("div", {}, [
        el("div", { class: "t-body text-ink" }, [meta.title]),
        el("div", { class: "t-meta text-mute" }, [`~${meta.duration} min · ${meta.kind}`])
      ]),
      el("span", { class: "t-meta text-mute" }, ["→"])
    ]);
  }
  phaseCards.forEach(c => sheet.appendChild(row(c)));
  if (allCards.length) {
    sheet.appendChild(el("div", { class: "t-micro text-mute mt-3 mb-2" }, ["Other phases"]));
    allCards.forEach(c => sheet.appendChild(row(c)));
  }
  if (STATE.todayOverride) {
    sheet.appendChild(el("button", {
      class: "w-full mt-3 py-2 text-mute t-meta",
      onClick: () => { setTodayCardType(null); backdrop.remove(); render(); }
    }, ["Clear override · use scheduled card"]));
  }

  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
}

function todaySession() {
  const id = sessionIdFor(new Date());
  if (STATE.sessions[id]) return STATE.sessions[id];
  const s = generateSession(new Date());
  STATE.sessions[id] = s; saveState();
  return s;
}

function TodayScreen() {
  const wrap = el("div");
  const session = todaySession();
  const meta = session.meta || CARD_META[session.cardType];
  const isOff = meta?.kind === "off";
  const isRest = meta?.kind === "rest";
  const isCompleted = !!session.completedAt;
  const todayKey = todayISO();

  // Three-anchor header: wordmark · mesocycle indicator · cog.
  // Mesocycle "day of cycle" is 1..35 within the current 5-week block.
  const startMs = new Date(STATE.mesocycle.startDate + "T00:00:00").getTime();
  const daysSinceStart = Math.max(0, Math.floor((Date.now() - startMs) / 86400000));
  const dayOfMesocycle = (daysSinceStart % 35) + 1;
  const mesoLabel = el("span", { class: "t-meta text-mute" }, [
    "Wk ", el("span", { class: "num" }, [String(STATE.mesocycle.currentWeek)]),
    "/", el("span", { class: "num" }, ["5"]),
    " · Day ", el("span", { class: "num" }, [String(dayOfMesocycle)])
  ]);
  wrap.appendChild(appBar(mesoLabel, {
    leftContent: (() => {
      const wrap = el("div", { class: "flex items-center gap-2" });
      const logo = el("span", { class: "inline-flex items-center justify-center", "aria-hidden": "true" });
      // Brand mark: dark tile + cyan lifeline. Same motif as the PWA icon.
      logo.innerHTML = '<svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="#0E1218"/><g stroke="#22D3EE" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M5 16 H10 L12 11 L16 21 L18 16 H27"/></g><circle cx="16" cy="26" r="1.4" fill="#22D3EE"/></svg>';
      wrap.appendChild(logo);
      wrap.appendChild(el("span", {
        class: "text-ink font-semibold",
        style: { fontSize: "20px", letterSpacing: "-0.02em", lineHeight: "1" }
      }, ["Cadence"]));
      return wrap;
    })(),
    right: iconBtn(ICONS.cog, () => navigate("settings"), { label: "Settings" })
  }));

  const totalSets = (session.planned || []).reduce((n, p) => n + p.sets.length, 0);
  const dayName = new Date().toLocaleDateString(undefined, { weekday: "short" });

  const card = el("section", { class: "bg-card rounded-md p-5 border border-hairline" });
  if (isCompleted) {
    // Workout complete — render a summary, not a start CTA.
    const completedSets = (session.planned || []).reduce(
      (n, p) => n + (p.sets || []).filter(s => s.completed).length, 0
    );
    const totalReps = (session.planned || []).reduce(
      (n, p) => n + (p.sets || []).filter(s => s.completed).reduce((r, s) => r + (s.reps || 0), 0), 0
    );
    const finishedAt = new Date(session.completedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    card.appendChild(el("div", { class: "space-y-3" }, [
      el("div", { class: "flex items-center gap-2" }, [
        el("span", { class: "t-meta text-mute" }, [`${dayName} · ${PHASES[STATE.profile.phase].short}`]),
        pill("Done", "accent")
      ]),
      el("h2", { class: "t-display text-ink" }, [meta.title]),
      el("div", { class: "t-meta text-mute" }, [
        session.durationActual ? el("span", { class: "num" }, [`${session.durationActual} min`]) : "—",
        " · ",
        el("span", { class: "num" }, [String(completedSets)]), " sets · ",
        totalReps ? [el("span", { class: "num" }, [String(totalReps)]), " reps"] : "logged",
        ` · finished at ${finishedAt}`
      ])
    ].filter(Boolean)));

    if (session.sessionSymptomFlag === true) {
      card.appendChild(el("div", { class: "mt-3 t-meta text-warn" }, ["⚠ Pain flagged at end of session"]));
    }

    card.appendChild(el("button", {
      class: "w-full mt-5 h-12 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight active:scale-[.985] active:opacity-90 transition",
      onClick: () => navigate("done", { _id: session.id })
    }, ["View summary"]));

    card.appendChild(el("div", { class: "grid grid-cols-2 gap-2 mt-2" }, [
      el("button", {
        class: "py-2 text-mute t-meta",
        onClick: () => {
          // Edit-mode: keeps every logged value, lets user correct kg/reps,
          // explicitly skips re-finalize until they hit "Done editing".
          session.editing = true;
          delete session.completedAt;
          delete session.durationActual;
          STATE.sessions[session.id] = session;
          saveState(); navigate("session");
        }
      }, ["Edit logged sets"]),
      el("button", {
        class: "py-2 text-mute t-meta",
        onClick: () => {
          if (!confirm("Reset today's workout?\n\nAll completed sets and logged values will be cleared. You'll start the same workout from the beginning.")) return;
          (session.planned || []).forEach(p => {
            (p.sets || []).forEach(s => { s.completed = false; s.reps = null; s.load = null; });
            delete p.symptomFlag;
            delete p.skipped;
          });
          (session.recovery || []).forEach(r => { r.completed = false; });
          delete session.completedAt;
          delete session.durationActual;
          delete session.startedAt;
          delete session.sessionSymptomFlag;
          delete session.editing;
          STATE.sessions[session.id] = session;
          saveState(); navigate("today");
        }
      }, ["Reset workout"])
    ]));
  } else if (isRest) {
    const tomorrow = new Date(Date.now() + 86400000);
    const tomPlan = generateSession(tomorrow);
    card.appendChild(el("div", { class: "space-y-3" }, [
      el("div", { class: "t-meta text-mute" }, [`${dayName} · ${PHASES[STATE.profile.phase].short}`]),
      el("h2", { class: "t-display text-ink" }, ["Rest day"]),
      el("p", { class: "t-meta text-mute" }, [
        tomPlan.meta?.kind === "rest"
          ? "Tomorrow is also marked rest. Take it easy."
          : `Plan carried forward — tomorrow: ${tomPlan.meta?.title || "Off Day"}.`
      ])
    ]));
    card.appendChild(el("button", {
      class: "w-full mt-5 h-14 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight active:scale-[.985] active:opacity-90 transition",
      onClick: openTodayCardPicker
    }, ["Pick a workout instead"]));
    card.appendChild(el("button", {
      class: "w-full mt-2 py-2 text-mute t-meta",
      onClick: () => {
        STATE.restDays = (STATE.restDays || []).filter(d => d !== todayKey);
        STATE.daySkew = Math.max(0, (STATE.daySkew || 0) - 1);
        delete STATE.sessions[session.id];
        saveState(); render();
      }
    }, ["Undo rest day"]));
  } else if (isOff) {
    card.appendChild(el("div", { class: "space-y-3" }, [
      el("div", { class: "t-meta text-mute" }, [`${dayName} · ${PHASES[STATE.profile.phase].short}`]),
      el("h2", { class: "t-display text-ink" }, ["Off Day"]),
      el("p", { class: "t-meta text-mute" }, ["Scheduled rest. Tap below if you'd like to do a workout anyway."])
    ]));
    card.appendChild(el("button", {
      class: "w-full mt-5 h-14 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight active:scale-[.985] active:opacity-90 transition",
      onClick: openTodayCardPicker
    }, ["Pick a workout"]));
  } else {
    const overrideActive = STATE.todayOverride && STATE.todayOverride.date === todayKey;
    card.appendChild(el("div", { class: "space-y-2" }, [
      el("div", { class: "flex items-center gap-2 flex-wrap" }, [
        el("span", { class: "t-meta text-mute" }, [`${dayName} · ${PHASES[STATE.profile.phase].short}`]),
        session.deload ? pill("Deload week", "warn") : null,
        // Custom-pick pill is its own inverse: tap (anywhere on the pill) clears the override.
        overrideActive ? el("button", {
          class: "pill pill-accent inline-flex items-center gap-1.5 hover:bg-accent/5",
          "aria-label": "Clear custom workout override",
          onClick: () => { setTodayCardType(null); render(); }
        }, [
          "Custom pick",
          el("span", { class: "text-base leading-none -mr-0.5", "aria-hidden": "true" }, ["×"])
        ]) : null
      ]),
      el("h2", { class: "t-display text-ink" }, [meta.title]),
      el("div", { class: "t-meta text-mute" }, [
        el("span", { class: "num" }, [`~${meta.duration}`]), " min · ",
        el("span", { class: "num" }, [String(session.planned.length)]), " exercises · ",
        el("span", { class: "num" }, [String(totalSets)]), " sets"
      ])
    ]));

    if (session.recovery?.length) {
      card.appendChild(el("div", { class: "mt-4 pt-4 border-t border-hairline text-sm text-mute" }, [
        "Includes mandatory recovery block: " + session.recovery.map(r => r.name.split(":")[0]).join(" + ")
      ]));
    }

    card.appendChild(el("button", {
      class: "w-full mt-5 h-14 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight active:scale-[.985] active:opacity-90 transition",
      onClick: () => { session.startedAt = Date.now(); STATE.sessions[session.id] = session; saveState(); navigate("session"); }
    }, [session.startedAt && !session.completedAt ? "Resume" : "Start workout"]));

    card.appendChild(el("div", { class: "grid grid-cols-2 gap-2 mt-2" }, [
      el("button", {
        class: "py-2 text-mute t-meta",
        onClick: openTodayCardPicker
      }, ["Change workout"]),
      el("button", {
        class: "py-2 text-mute t-meta",
        onClick: () => {
          if (session.startedAt && !session.completedAt) { alert("You've already started today's session. Finish or pause first."); return; }
          if (!confirm("Mark today as a rest day?\n\nToday's plan carries forward to tomorrow.")) return;
          STATE.restDays = [...(STATE.restDays || []), todayKey];
          STATE.daySkew = (STATE.daySkew || 0) + 1;
          STATE.todayOverride = null;
          delete STATE.sessions[session.id];
          saveState(); render();
        }
      }, ["Rest today →"])
    ]));
  }
  wrap.appendChild(card);

  // Tomorrow preview — full card always (workout, off, or rest).
  const tomorrow = new Date(Date.now() + 86400000);
  const tomCard = generateSession(tomorrow);
  wrap.appendChild(el("section", { class: "mt-6" }, [
    el("h3", { class: "text-mute text-sm uppercase tracking-wide mb-2" }, ["Tomorrow"]),
    el("div", { class: "bg-surface rounded-md p-3 border border-hairline flex items-center justify-between" }, [
      el("div", {}, [
        el("div", { class: "font-medium" }, [tomCard.meta?.title || "Off Day"]),
        el("div", { class: "text-xs text-mute" }, [tomCard.planned.length ? `${tomCard.planned.length} exercises` : "—"])
      ]),
      el("span", { class: "text-mute text-xs" }, [tomorrow.toLocaleDateString(undefined, { weekday: "short" })])
    ])
  ]));

  // Reserve space so the sticky week strip doesn't cover content
  wrap.appendChild(el("div", { class: "h-24" }));

  // Sticky week strip — tap a day to preview its plan
  wrap.appendChild(weekStrip());

  return wrap;
}

//-----------------------------------------------------------------------------
// Week strip + day preview sheet
//-----------------------------------------------------------------------------

function startOfWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = (dow === 0 ? -6 : 1 - dow); // shift back to Monday
  d.setDate(d.getDate() + diff);
  return d;
}

function weekStrip() {
  const todayKey = todayISO();
  const monday = startOfWeek(new Date());
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i); return d;
  });

  const bar = el("nav", {
    class: "fixed bottom-0 left-0 right-0 bg-bg/95 backdrop-blur border-t border-hairline",
    style: { paddingBottom: "env(safe-area-inset-bottom)" }
  });
  const inner = el("div", { class: "max-w-md mx-auto px-3 py-2" });
  const label = el("div", { class: "text-mute text-[10px] uppercase tracking-wide mb-1 text-center" }, ["This week"]);
  inner.appendChild(label);

  const row = el("div", { class: "grid grid-cols-7 gap-1" });
  days.forEach(d => {
    const iso = localISO(d);
    const isToday = iso === todayKey;
    const session = STATE.sessions["s_" + iso];
    const preview = generateSession(d);
    const meta = preview.meta || CARD_META[preview.cardType];
    const isOff = meta?.kind === "off";
    const isRest = meta?.kind === "rest";
    const completed = !!session?.completedAt;

    // Three states (today's surrounding box stays unchanged):
    //   DONE       → filled accent
    //   SCHEDULED  → outlined accent (transparent fill)
    //   REST/OFF   → hollow hairline border
    let dotKlass, dotLabel;
    if (completed)            { dotKlass = "bg-accent border border-accent";  dotLabel = "Done"; }
    else if (isRest || isOff) { dotKlass = "bg-transparent border border-hairline"; dotLabel = isRest ? "Rest" : "Off"; }
    else                      { dotKlass = "bg-transparent border border-accent"; dotLabel = "Scheduled"; }

    const btn = el("button", {
      class: `flex flex-col items-center justify-center py-2 rounded-sm ${isToday ? "bg-surface2 ring-1 ring-accent/40" : "hover:bg-surface2"}`,
      onClick: () => openDayPreview(d)
    }, [
      el("div", { class: `text-xs ${isToday ? "text-accent" : "text-mute"} font-medium` }, [d.toLocaleDateString(undefined, { weekday: "short" })[0]]),
      el("div", { class: `text-sm ${isToday ? "text-ink" : "text-mute"}` }, [String(d.getDate())]),
      el("div", { class: `mt-1 w-2 h-2 rounded-full ${dotKlass}`, "aria-label": dotLabel })
    ]);
    row.appendChild(btn);
  });
  inner.appendChild(row);
  bar.appendChild(inner);
  return bar;
}

function openDayPreview(date) {
  const preview = generateSession(date);
  const meta = preview.meta || CARD_META[preview.cardType];
  const dayLabel = date.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

  // Backdrop
  const backdrop = el("div", {
    class: "fixed inset-0 bg-black/60 z-40 flex items-end justify-center fadein",
    onClick: (e) => { if (e.target === backdrop) backdrop.remove(); }
  });

  // Sheet
  const sheet = el("div", {
    class: "w-full max-w-md bg-card border-t border-hairline rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto no-scrollbar",
    style: { paddingBottom: "calc(env(safe-area-inset-bottom) + 1rem)" }
  });

  sheet.appendChild(el("div", { class: "flex items-start justify-between mb-3" }, [
    el("div", {}, [
      el("div", { class: "text-mute text-xs uppercase tracking-wide" }, [dayLabel]),
      el("h2", { class: "text-2xl font-semibold tracking-tight" }, [meta?.title || "Off Day"]),
      meta?.kind !== "off" ? el("div", { class: "text-mute text-sm mt-1" }, [
        `~${meta.duration} min · ${preview.planned.length} exercises · ${preview.planned.reduce((n,p)=>n+p.sets.length,0)} sets`
      ]) : null,
      preview.deload ? pill("Deload week", "warn") : null
    ]),
    el("button", { class: "text-mute text-xl px-2", onClick: () => backdrop.remove() }, ["×"])
  ]));

  if (meta?.kind === "rest") {
    sheet.appendChild(el("p", { class: "text-mute" }, ["Rest day — plan was carried forward."]));
  } else if (meta?.kind === "off") {
    sheet.appendChild(el("p", { class: "text-mute" }, ["Off day — no session planned."]));
  } else {
    const list = el("ol", { class: "space-y-2 mt-2" });
    preview.planned.forEach((p, i) => {
      list.appendChild(el("li", { class: "py-2 px-3 bg-surface rounded-sm border border-hairline" }, [
        el("div", { class: "flex justify-between items-baseline gap-2" }, [
          el("div", { class: "font-medium" }, [`${i+1}. ${p.name}`]),
          el("div", { class: "text-xs text-mute whitespace-nowrap" }, [setsLabel(p)])
        ]),
        p.cue ? el("div", { class: "text-xs text-mute mt-1" }, [p.cue]) : null
      ]));
    });
    sheet.appendChild(list);

    if (preview.recovery?.length) {
      sheet.appendChild(el("div", { class: "mt-4 pt-3 border-t border-hairline" }, [
        el("div", { class: "text-mute text-xs uppercase tracking-wide mb-2" }, ["Recovery block"]),
        ...preview.recovery.map(r => el("div", { class: "text-sm py-1" }, [`• ${r.name} · ${r.durationMin} min`]))
      ]));
    }

    const isToday = localISO(date) === todayISO();
    if (isToday) {
      sheet.appendChild(el("button", {
        class: "w-full mt-5 py-3 rounded-md bg-accent text-accentInk font-medium",
        onClick: () => { backdrop.remove(); navigate("today"); }
      }, ["Go to today"]));
    } else {
      // Allow "Do this workout today" for any day's preview — pulls that day's
      // card type to today as an override.
      sheet.appendChild(el("button", {
        class: "w-full mt-5 h-12 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight",
        onClick: () => { setTodayCardType(preview.cardType); backdrop.remove(); navigate("today"); }
      }, [`Do this today → ${preview.meta?.title || preview.cardType}`]));
      sheet.appendChild(el("button", {
        class: "w-full mt-2 py-2 text-mute t-meta",
        onClick: () => backdrop.remove()
      }, ["Close"]));
    }
  }

  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
}

//-----------------------------------------------------------------------------
// In-Progress screen — PRD §7 Flow A 2-4
//-----------------------------------------------------------------------------

function SessionScreen() {
  const wrap = el("div");
  const session = STATE.sessions[sessionIdFor(new Date())] || todaySession();
  if (!session.planned?.length && !session.recovery?.length) { navigate("today"); return wrap; }
  // Completed session AND not in edit mode → bounce back to Today so the user
  // sees the summary card, not a re-finalize loop.
  if (session.completedAt && !session.editing) { navigate("today"); return wrap; }

  // Edit mode: render every exercise as a static editable stack. No
  // auto-advance, no auto-finalize, no Done navigation. User taps "Done editing"
  // to return to Today (which restamps completedAt if it was previously set).
  if (session.editing) return EditModeScreen(wrap, session);

  let activeIdx = session.planned.findIndex(p => p.sets.some(s => !s.completed));
  if (activeIdx === -1) activeIdx = session.planned.length; // recovery phase
  let lastAnimatedIdx = -1; // animate the active card only when activeIdx changes

  function paint() {
    wrap.innerHTML = "";
    const exitSession = () => { if (confirm("Exit session? Progress is saved.")) navigate("today"); };
    const doneCount = session.planned.filter(p => p.sets.every(s => s.completed)).length
                    + (session.recovery || []).filter(r => r.completed).length;
    const total = session.planned.length + (session.recovery?.length || 0);
    wrap.appendChild(appBar(session.meta?.title || "Session", {
      subtitle: `${doneCount} of ${total} complete`,
      back: exitSession,
      home: exitSession
    }));

    wrap.appendChild(el("div", { class: "h-1 bg-surface2 rounded-full mb-5 overflow-hidden" }, [
      el("div", { class: "h-full bg-accent", style: { width: `${(doneCount/total)*100}%` } })
    ]));

    // Completed list (above the active card) — pills for everything finished or skipped.
    const completedExercises = session.planned.slice(0, activeIdx);
    if (completedExercises.length) {
      const setsDone = (p) => (p.sets || []).filter(s => s.completed).length;
      wrap.appendChild(el("div", { class: "mb-4" }, [
        el("h3", { class: "t-micro text-mute mb-2" }, [`Completed · ${completedExercises.length}`]),
        el("div", { class: "flex flex-wrap gap-1.5" }, completedExercises.map((p, i) => {
          const skipped = !!p.skipped;
          const pillCls = skipped
            ? "inline-flex items-center gap-1.5 py-1 pl-1.5 pr-2.5 rounded-sm bg-warn/5 text-warn t-meta border border-warn/40"
            : "inline-flex items-center gap-1.5 py-1 pl-1.5 pr-2.5 rounded-sm bg-ok/10 text-ok t-meta border border-ok/30";
          const mark = skipped ? "↷" : "✓";
          return el("span", { class: pillCls, title: setsLabel(p) }, [
            el("span", { class: "num text-[11px]" }, [String(i + 1)]),
            el("span", { class: "font-semibold" }, [mark]),
            el("span", { class: "text-ink truncate max-w-[10rem]" }, [p.name]),
            !skipped ? el("span", { class: "num text-mute text-[11px]" }, [`${setsDone(p)}/${p.sets.length}`]) : null
          ]);
        }))
      ]));
    }

    if (activeIdx < session.planned.length) {
      const ex = session.planned[activeIdx];
      wrap.appendChild(exerciseCard(ex, activeIdx));
    } else if ((session.recovery || []).some(r => !r.completed)) {
      wrap.appendChild(recoveryCard(session));
    } else {
      finalize(session);
      navigate("done", { _id: session.id });
      return;
    }

    // upcoming list
    if (activeIdx + 1 < session.planned.length) {
      wrap.appendChild(el("div", { class: "mt-6" }, [
        el("h3", { class: "text-mute text-sm uppercase tracking-wide mb-2" }, ["Up next"]),
        ...session.planned.slice(activeIdx + 1).map((p, i) => el("div", {
          class: "py-2 px-3 bg-surface rounded-sm mb-1 text-sm flex justify-between"
        }, [
          el("span", {}, [`${activeIdx + 2 + i}. ${p.name}`]),
          el("span", { class: "text-mute" }, [setsLabel(p)])
        ]))
      ]));
    }
  }

  function exerciseCard(ex, idx) {
    const animClass = lastAnimatedIdx === idx ? "" : "card-advance";
    lastAnimatedIdx = idx;
    const card = el("section", { class: `bg-surface border border-hairline rounded-md p-6 shadow-active ${animClass}` });
    const flagBtn = el("button", {
      class: `inline-flex items-center justify-center w-9 h-9 rounded-sm ${ex.symptomFlag ? "text-warn" : "text-mute hover:text-ink"}`,
      "aria-label": "Flag symptom",
      onClick: () => {
        const turning = !ex.symptomFlag;
        if (turning && !confirm(`Flag a symptom on ${ex.name}?`)) return;
        ex.symptomFlag = turning;
        saveState({ remote: false });
        paint();
      }
    });
    flagBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4"/><path d="M4 4h11l-2 4 2 4H4"/></svg>';
    card.appendChild(el("div", { class: "flex items-start justify-between mb-3 gap-2" }, [
      el("div", { class: "min-w-0" }, [
        el("div", { class: "t-micro text-mute" }, [`Exercise ${idx+1} of ${session.planned.length}`]),
        el("h2", { class: "t-display text-ink" }, [ex.name])
      ]),
      el("div", { class: "flex items-center gap-1 shrink-0" }, [
        ex.isPhysio ? pill("Physio", "accent") : null,
        ex.isWarmup ? pill("Warmup") : null,
        flagBtn
      ])
    ]));
    if (ex.cue) card.appendChild(el("p", { class: "text-sm text-ink mb-2" }, [ex.cue]));
    if (ex.notes) card.appendChild(el("p", { class: "text-xs text-mute mb-3" }, [ex.notes]));
    if (ex.prescribedNote) card.appendChild(el("p", { class: "text-xs text-accent mb-3" }, [ex.prescribedNote]));

    // How-to disclosure (reference links)
    if (!ex.kind || ex.kind !== "recovery") card.appendChild(howToDisclosure(ex));

    ex.sets.forEach((set, sIdx) => {
      const row = el("div", { class: "grid grid-cols-[32px_28px_1fr_auto] items-center gap-3 row-press", style: { height: "52px" } });
      const cb = el("button", {
        class: `check w-[26px] h-[26px] rounded-full border-[1.5px] ${set.completed ? "bg-ok border-ok set-check-anim" : "border-dim"}`,
        onClick: () => {
          // Quick-log: tapping an empty unchecked set fills reps from last session (or top of range)
          // and load from prescription. User can still tap-to-expand and edit before/after.
          if (!set.completed) {
            const hist = STATE.exerciseHistory[ex.exerciseId];
            if (set.reps == null) set.reps = hist?.lastReps ?? ex.repRange[1];
            if (set.load == null) set.load = hist?.lastLoad ?? ex.prescribedLoad ?? null;
          }
          set.completed = !set.completed;
          saveState({remote:false});
          paint();
        }
      }, [set.completed ? el("span", { class: "text-accentInk text-xs", style: { lineHeight: "0" } }, ["✓"]) : ""]);

      const setNum = el("span", { class: "t-meta num text-mute" }, [String(sIdx + 1)]);

      const mod = ex.modality || "reps";
      const unitLabel = mod === "time" ? "sec" : mod === "rounds" ? "rounds" : "reps";
      const showLoad = mod === "reps" && !ex.isPhysio;
      const sideTag = ex.unilateral ? " /side" : "";

      const repsCol = el("button", { class: "t-body num text-ink text-left", onClick: () => toggleExpand(sIdx) });
      if (set.reps != null) {
        repsCol.appendChild(document.createTextNode(String(set.reps)));
        repsCol.appendChild(el("span", { class: "t-meta text-mute ml-1" }, [unitLabel + sideTag]));
      } else {
        repsCol.appendChild(document.createTextNode(`${ex.repRange[0]}–${ex.repRange[1]}`));
        repsCol.appendChild(el("span", { class: "t-meta text-mute ml-1" }, [unitLabel + sideTag]));
      }

      row.appendChild(cb); row.appendChild(setNum); row.appendChild(repsCol);

      if (showLoad) {
        const loadCol = el("button", { class: "t-body num text-mute text-right", onClick: () => toggleExpand(sIdx) });
        if (set.load != null) {
          loadCol.appendChild(document.createTextNode(String(set.load)));
        } else {
          loadCol.appendChild(document.createTextNode("—"));
        }
        loadCol.appendChild(el("span", { class: "t-meta text-mute ml-1" }, ["kg"]));
        row.appendChild(loadCol);
      } else {
        row.appendChild(el("span"));
      }
      card.appendChild(row);

      function toggleExpand(i) {
        const exists = card.querySelector(`[data-edit="${i}"]`);
        if (exists) { exists.remove(); return; }
        const editor = el("div", { "data-edit": String(i), class: "ml-11 mb-2 flex gap-2" }, [
          numericInput("kg", set.load, v => { set.load = v; saveState({remote:false}); }),
          numericInput("reps", set.reps, v => { set.reps = v; saveState({remote:false}); })
        ]);
        row.after(editor);
      }
    });

    if (ex.symptomFlag) card.appendChild(el("div", { class: "mt-3 t-meta text-warn" }, ["⚠ Symptom flagged"]));

    // Auto-advance when all sets complete
    if (ex.sets.every(s => s.completed)) {
      setTimeout(() => { activeIdx++; paint(); }, 250);
    }

    card.appendChild(el("div", { class: "mt-4 grid grid-cols-3 gap-2" }, [
      el("button", {
        class: "h-10 rounded-sm bg-surface2 text-mute t-meta",
        onClick: () => openSwapPicker(ex, activeIdx)
      }, ["Swap"]),
      el("button", {
        class: "h-10 rounded-sm bg-surface2 text-mute t-meta",
        onClick: () => {
          if (!confirm(`Skip ${ex.name}?`)) return;
          ex.skipped = true;
          ex.sets = ex.sets.filter(s => s.completed);
          saveState({ remote: false });
          activeIdx++;
          paint();
        }
      }, ["Skip →"]),
      el("button", {
        class: "h-10 rounded-sm bg-surface2 text-mute t-meta",
        onClick: () => { ex.sets.forEach(s => s.completed = true); saveState({remote:false}); paint(); }
      }, ["Mark all"])
    ]));

    return card;
  }

  // Swap an active exercise for an alternate from the same category.
  // Preserves any completed-set count; warns if there's progress to be lost.
  function openSwapPicker(currentEx, idx) {
    const completedCount = currentEx.sets.filter(s => s.completed).length;
    if (completedCount > 0 && !confirm(`You've completed ${completedCount} ${completedCount === 1 ? "set" : "sets"} on ${currentEx.name}. Swapping will replace this exercise with a fresh one. Continue?`)) return;

    // Find alternates: same category, eligible for current phase, equipment OK,
    // not contraindicated, not already in today's plan.
    const usedIdsToday = new Set((session.planned || []).map(p => p.exerciseId));
    const phase = STATE.profile.phase;
    const equip = new Set(STATE.profile.equipment);
    const contras = new Set(STATE.profile.contraindications);
    const disabled = new Set(STATE.profile.disabledTypes || []);
    const alts = EXERCISES.filter(e =>
      e.category === currentEx.category &&
      e.id !== currentEx.exerciseId &&
      !usedIdsToday.has(e.id) &&
      e.phase_eligibility?.includes(phase) &&
      e.equipment_required?.every(eq => equip.has(eq)) &&
      !e.contraindication_tags?.some(t => contras.has(t)) &&
      !(e.exercise_types || []).some(t => disabled.has(t))
    ).slice(0, 8);

    if (!alts.length) { alert("No alternate exercises available in this category."); return; }

    const backdrop = el("div", {
      class: "fixed inset-0 bg-black/60 z-40 flex items-end justify-center fadein",
      onClick: (e) => { if (e.target === backdrop) backdrop.remove(); }
    });
    const sheet = el("div", {
      class: "w-full max-w-md bg-card border-t border-hairline rounded-t-md p-5 max-h-[85vh] overflow-y-auto no-scrollbar",
      style: { paddingBottom: "calc(env(safe-area-inset-bottom) + 1rem)" }
    });
    sheet.appendChild(el("div", { class: "flex items-start justify-between mb-3" }, [
      el("div", {}, [
        el("div", { class: "t-micro text-mute" }, [`Swap ${currentEx.name}`]),
        el("h2", { class: "t-body text-ink mt-1" }, ["Pick an alternate"])
      ]),
      el("button", { class: "text-mute text-xl px-2", onClick: () => backdrop.remove() }, ["×"])
    ]));
    alts.forEach(alt => {
      const item = el("button", {
        class: "w-full text-left py-3 px-3 rounded-sm border border-hairline mb-2 hover:bg-surface2",
        onClick: () => {
          const repRange = alt.rep_ranges?.[`phase_${phase}`] || [8,12];
          const sets = (currentEx.sets || []).length;
          session.planned[idx] = {
            ...currentEx,
            exerciseId: alt.id, name: alt.name, category: alt.category,
            sets: Array.from({ length: sets }, () => ({ reps: null, load: null, completed: false })),
            repRange, prescribedLoad: null, prescribedNote: "Swapped",
            rest_seconds: alt.rest_seconds,
            isPhysio: alt.is_physio || false,
            isWarmup: false,
            cue: alt.cue || "",
            modality: alt.modality || "reps",
            unilateral: (alt.position_tags || []).includes("unilateral"),
            videoUrl: alt.video_url || null,
            videoSource: alt.video_source || null,
            videoDurationSec: alt.video_duration_sec || null
          };
          saveState({ remote: false });
          backdrop.remove();
          paint();
        }
      }, [
        el("div", { class: "t-body text-ink" }, [alt.name]),
        el("div", { class: "t-meta text-mute mt-1 truncate" }, [alt.cue || ""])
      ]);
      sheet.appendChild(item);
    });
    backdrop.appendChild(sheet);
    document.body.appendChild(backdrop);
  }

  function recoveryCard(session) {
    const card = el("section", { class: "bg-card border border-hairline rounded-md p-5" });
    card.appendChild(el("h2", { class: "text-xl font-semibold mb-1" }, ["Recovery block"]));
    card.appendChild(el("p", { class: "text-xs text-mute mb-3" }, ["Unskippable on resistance days in Phase 0/1."]));
    session.recovery.forEach((b, i) => {
      const row = el("div", { class: "flex items-center gap-3 py-2" });
      row.appendChild(el("button", {
        class: `check w-8 h-8 rounded-full border-2 ${b.completed ? "bg-ok border-ok" : "border-dim"}`,
        onClick: () => { b.completed = !b.completed; saveState({remote:false}); paint(); }
      }, [b.completed ? el("span", { class: "text-accentInk font-bold" }, ["✓"]) : ""]));
      row.appendChild(el("div", {}, [
        el("div", { class: "text-sm font-medium" }, [b.name]),
        el("div", { class: "text-xs text-mute" }, [`${b.durationMin} min`])
      ]));
      card.appendChild(row);
    });
    return card;
  }

  function numericInput(label, value, onChange) {
    const wrap = el("label", {
      class: "grid grid-cols-[40px_1fr_40px] items-center h-12 bg-surface2 rounded-sm flex-1"
    });
    const dec = el("button", { type: "button", class: "text-mute text-2xl h-full", onClick: (e) => { e.preventDefault(); const n = (parseFloat(input.value) || 0) - (label === "kg" ? 0.5 : 1); input.value = String(n); onChange(n); } }, ["−"]);
    const center = el("div", { class: "flex items-baseline justify-center gap-1" });
    const input = el("input", {
      type: "number", inputmode: "decimal",
      class: "num text-ink text-[17px] font-medium bg-transparent w-12 text-center outline-none",
      value: value ?? ""
    });
    input.addEventListener("input", e => onChange(e.target.value === "" ? null : parseFloat(e.target.value)));
    center.appendChild(input);
    center.appendChild(el("span", { class: "t-meta text-mute" }, [label]));
    const inc = el("button", { type: "button", class: "text-mute text-2xl h-full", onClick: (e) => { e.preventDefault(); const n = (parseFloat(input.value) || 0) + (label === "kg" ? 0.5 : 1); input.value = String(n); onChange(n); } }, ["+"]);
    wrap.appendChild(dec); wrap.appendChild(center); wrap.appendChild(inc);
    return wrap;
  }

  paint();
  return wrap;
}

//-----------------------------------------------------------------------------
// Done screen — PRD §7 Flow A.5
//-----------------------------------------------------------------------------

function finalize(session) {
  session.completedAt = Date.now();
  session.durationActual = session.startedAt ? Math.round((session.completedAt - session.startedAt) / 60000) : null;

  // Update userExerciseHistory
  for (const p of session.planned) {
    const completedSets = p.sets.filter(s => s.completed);
    if (!completedSets.length) continue;
    const lastSet = completedSets[completedSets.length - 1];
    const prev = STATE.exerciseHistory[p.exerciseId] || { symptomFlagCount: 0 };
    STATE.exerciseHistory[p.exerciseId] = {
      lastDate: session.date,
      lastLoad: lastSet.load ?? prev.lastLoad ?? null,
      lastReps: lastSet.reps ?? prev.lastReps ?? null,
      lastSymptomFlag: !!p.symptomFlag,
      symptomFlagCount: (prev.symptomFlagCount || 0) + (p.symptomFlag ? 1 : 0),
      lastCardType: session.cardType
    };
  }
  STATE.sessions[session.id] = session;
  saveState();
  syncSession(session);
}

// Edit mode: full-session editor for a previously-finalized workout.
// Every exercise renders as a static card with editable kg/reps. No
// auto-advance, no auto-finalize. "Done editing" re-stamps completedAt
// and returns the user to Today.
function EditModeScreen(wrap, session) {
  function paint() {
    wrap.innerHTML = "";
    const exit = () => {
      // Re-stamp completedAt when leaving edit mode so the session is once
      // again "completed" (the user may have just been correcting numbers).
      session.editing = false;
      session.completedAt = session.completedAt || Date.now();
      session.durationActual = session.durationActual || null;
      // Refresh exerciseHistory with the corrected values.
      for (const p of session.planned || []) {
        const completedSets = (p.sets || []).filter(s => s.completed);
        if (!completedSets.length) continue;
        const lastSet = completedSets[completedSets.length - 1];
        const prev = STATE.exerciseHistory[p.exerciseId] || { symptomFlagCount: 0 };
        STATE.exerciseHistory[p.exerciseId] = {
          ...prev,
          lastDate: session.date,
          lastLoad: lastSet.load ?? prev.lastLoad ?? null,
          lastReps: lastSet.reps ?? prev.lastReps ?? null,
          lastCardType: session.cardType
        };
      }
      saveState(); syncSession(session); navigate("today");
    };

    wrap.appendChild(appBar("Edit logged sets", {
      subtitle: session.meta?.title || session.cardType,
      back: exit,
      home: exit
    }));

    wrap.appendChild(el("p", { class: "t-meta text-mute mb-4" }, [
      "Tap any set to expand and correct kg or reps. Toggling the checkbox marks/unmarks. Changes save automatically."
    ]));

    (session.planned || []).forEach((ex, idx) => {
      const card = el("section", { class: "bg-surface border border-hairline rounded-md p-5 mb-3" });
      card.appendChild(el("div", { class: "flex items-start justify-between mb-2 gap-2" }, [
        el("div", { class: "min-w-0" }, [
          el("div", { class: "t-micro text-mute" }, [`Exercise ${idx + 1}`]),
          el("h2", { class: "t-body text-ink" }, [ex.name])
        ]),
        ex.isWarmup ? pill("Warmup") : ex.isPhysio ? pill("Physio", "accent") : null
      ]));

      ex.sets.forEach((set, sIdx) => {
        const mod = ex.modality || "reps";
        const unitLabel = mod === "time" ? "sec" : mod === "rounds" ? "rounds" : "reps";
        const showLoad = mod === "reps" && !ex.isPhysio;

        const row = el("div", { class: "grid grid-cols-[32px_28px_1fr_auto] items-center gap-3", style: { height: "44px" } });
        row.appendChild(el("button", {
          class: `check w-[24px] h-[24px] rounded-full border-[1.5px] ${set.completed ? "bg-ok border-ok" : "border-dim"}`,
          onClick: () => { set.completed = !set.completed; saveState({ remote: false }); paint(); }
        }, [set.completed ? el("span", { class: "text-accentInk text-xs", style: { lineHeight: "0" } }, ["✓"]) : ""]));
        row.appendChild(el("span", { class: "t-meta num text-mute" }, [String(sIdx + 1)]));

        const repsBtn = el("button", { class: "t-body num text-ink text-left", onClick: () => toggleEditor(card, ex, set, sIdx) });
        const repsVal = set.reps != null ? String(set.reps) : `${ex.repRange[0]}–${ex.repRange[1]}`;
        repsBtn.appendChild(document.createTextNode(repsVal));
        repsBtn.appendChild(el("span", { class: "t-meta text-mute ml-1" }, [unitLabel]));
        row.appendChild(repsBtn);

        if (showLoad) {
          const loadBtn = el("button", { class: "t-body num text-mute text-right", onClick: () => toggleEditor(card, ex, set, sIdx) });
          loadBtn.appendChild(document.createTextNode(set.load != null ? String(set.load) : "—"));
          loadBtn.appendChild(el("span", { class: "t-meta text-mute ml-1" }, ["kg"]));
          row.appendChild(loadBtn);
        } else { row.appendChild(el("span")); }
        card.appendChild(row);
      });
      wrap.appendChild(card);
    });

    wrap.appendChild(el("button", {
      class: "w-full mt-2 mb-8 h-12 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight active:scale-[.985] active:opacity-90 transition",
      onClick: exit
    }, ["Done editing"]));
  }

  function toggleEditor(card, ex, set, sIdx) {
    const existing = card.querySelector(`[data-edit="${sIdx}"]`);
    if (existing) { existing.remove(); return; }
    const editor = el("div", { "data-edit": String(sIdx), class: "ml-9 mb-2 flex gap-2" });
    const repsInput = el("input", {
      type: "number", inputmode: "decimal",
      class: "num text-ink text-[17px] font-medium bg-surface2 rounded-sm w-full px-3 py-2 outline-none",
      value: set.reps ?? "",
      placeholder: `${ex.repRange[0]}–${ex.repRange[1]} ${ex.modality === "time" ? "sec" : ex.modality === "rounds" ? "rounds" : "reps"}`
    });
    repsInput.addEventListener("input", e => { set.reps = e.target.value === "" ? null : parseFloat(e.target.value); saveState({ remote: false }); });
    editor.appendChild(repsInput);

    if ((ex.modality || "reps") === "reps" && !ex.isPhysio) {
      const loadInput = el("input", {
        type: "number", inputmode: "decimal",
        class: "num text-ink text-[17px] font-medium bg-surface2 rounded-sm w-full px-3 py-2 outline-none",
        value: set.load ?? "",
        placeholder: "kg"
      });
      loadInput.addEventListener("input", e => { set.load = e.target.value === "" ? null : parseFloat(e.target.value); saveState({ remote: false }); });
      editor.appendChild(loadInput);
    }
    // Insert after the row that triggered it
    const rows = Array.from(card.querySelectorAll("div.grid"));
    const targetRow = rows[sIdx];
    if (targetRow) targetRow.after(editor);
  }

  paint();
  return wrap;
}

function DoneScreen() {
  const wrap = el("div");
  const session = STATE.sessions[currentRoute().id] || STATE.sessions[sessionIdFor(new Date())];
  wrap.appendChild(appBar("Done", { back: () => navigate("today") }));

  if (!session) {
    wrap.appendChild(el("p", { class: "t-meta text-mute" }, ["No session found."]));
    return wrap;
  }

  // ─── Header with key totals ─────────────────────────────────────────────
  const completedSetCount = (session.planned || []).reduce(
    (n, p) => n + (p.sets || []).filter(s => s.completed).length, 0
  );
  const totalReps = (session.planned || []).reduce(
    (n, p) => n + (p.sets || []).filter(s => s.completed).reduce((r, s) => r + (s.reps || 0), 0), 0
  );
  const totalVolume = (session.planned || []).reduce(
    (n, p) => n + (p.sets || []).filter(s => s.completed && s.load != null && s.reps != null)
      .reduce((v, s) => v + s.load * s.reps, 0), 0
  );
  const finishedAt = session.completedAt
    ? new Date(session.completedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
    : null;

  const header = el("section", { class: "bg-surface border border-hairline rounded-md p-5 mb-4" });
  header.appendChild(el("div", { class: "flex items-center gap-2 mb-2 flex-wrap" }, [
    pill("Done", "accent"),
    session.sessionSymptomFlag === true ? pill("Pain flagged", "warn") : null
  ]));
  header.appendChild(el("h2", { class: "t-display text-ink mb-1" }, [session.meta?.title || "Session"]));
  header.appendChild(el("div", { class: "t-meta text-mute" }, [
    session.durationActual ? [el("span", { class: "num" }, [String(session.durationActual)]), " min · "] : "",
    el("span", { class: "num" }, [String(completedSetCount)]), " sets · ",
    el("span", { class: "num" }, [String(totalReps)]), " reps",
    totalVolume > 0 ? [" · ", el("span", { class: "num" }, [Math.round(totalVolume).toString()]), " kg total volume"] : "",
    finishedAt ? ` · finished ${finishedAt}` : ""
  ].filter(Boolean)));
  wrap.appendChild(header);

  // ─── Per-exercise breakdown ─────────────────────────────────────────────
  const list = el("section", { class: "bg-card border border-hairline rounded-md p-4 mb-4" });
  list.appendChild(el("h3", { class: "t-micro text-mute mb-3" }, ["What you did"]));
  (session.planned || []).forEach((p, i) => {
    const completed = (p.sets || []).filter(s => s.completed);
    if (!completed.length && !p.skipped) return;
    const row = el("div", { class: "py-2 border-b border-hairline last:border-0" });
    row.appendChild(el("div", { class: "flex items-center justify-between gap-2 flex-wrap" }, [
      el("div", { class: "t-body text-ink min-w-0 truncate" }, [
        `${i + 1}. ${p.name}`,
        p.symptomFlag ? el("span", { class: "ml-2 t-meta text-warn" }, ["⚠"]) : null,
        p.isWarmup ? el("span", { class: "ml-2 t-meta text-mute" }, ["· warmup"]) : null
      ]),
      p.skipped
        ? el("span", { class: "t-meta text-mute" }, ["skipped"])
        : el("span", { class: "t-meta num text-mute" }, [
            `${completed.length}/${p.sets.length} sets`
          ])
    ]));
    if (!p.skipped && completed.length) {
      const detail = completed.map(s => {
        const reps = s.reps != null ? s.reps : "—";
        if (p.modality === "time") return `${reps}s`;
        if (p.modality === "rounds") return `${reps}r`;
        const load = s.load != null ? `@${s.load}kg` : "";
        return `${reps}${load}`;
      }).join(" · ");
      row.appendChild(el("div", { class: "t-meta num text-mute mt-1 truncate" }, [detail]));
    }
    list.appendChild(row);
  });

  // Recovery block summary (Phase 0/1 resistance days)
  if (session.recovery?.length) {
    const recDone = session.recovery.filter(r => r.completed).length;
    list.appendChild(el("div", { class: "py-2 border-t border-hairline mt-1" }, [
      el("div", { class: "t-meta text-mute" }, [
        `Recovery block: ${recDone}/${session.recovery.length} blocks completed`
      ])
    ]));
  }
  wrap.appendChild(list);

  // ─── Pain prompt OR primary actions ─────────────────────────────────────
  if (session.sessionSymptomFlag == null) {
    wrap.appendChild(el("section", { class: "mt-2" }, [
      el("h3", { class: "t-micro text-mute mb-2" }, ["Any pain today?"]),
      el("div", { class: "flex gap-2" }, [
        el("button", { class: "flex-1 h-12 rounded-sm bg-surface2 text-ink t-body", onClick: () => { session.sessionSymptomFlag = false; saveState(); syncSession(session); render(); } }, ["No"]),
        el("button", { class: "flex-1 h-12 rounded-sm bg-warn/10 text-warn t-body border border-warn", onClick: () => { session.sessionSymptomFlag = true; saveState(); syncSession(session); render(); } }, ["Yes"])
      ])
    ]));
  } else {
    wrap.appendChild(el("button", {
      class: "w-full mt-2 h-12 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight active:scale-[.985] active:opacity-90 transition",
      onClick: () => navigate("today")
    }, ["Finish"]));
  }
  return wrap;
}

//-----------------------------------------------------------------------------
// Settings — PRD §11 (P0: phase, equipment, contraindications, deload override)
//-----------------------------------------------------------------------------

// ─── Settings helpers (sheet, row, group) ─────────────────────────────────
//
// openSheet({title, subtitle?, body, onClose?}) — generic bottom sheet
//   used by every Settings picker. Returns { close, sheet } so callers can
//   replace the body in place (e.g. after a chip toggle re-renders content).
function openSheet(opts) {
  const backdrop = el("div", {
    class: "fixed inset-0 bg-black/60 z-40 flex items-end justify-center fadein",
    onClick: e => { if (e.target === backdrop) close(); }
  });
  const sheet = el("div", {
    class: "w-full max-w-md bg-card border-t border-hairline rounded-t-md p-5 max-h-[85vh] overflow-y-auto no-scrollbar",
    style: { paddingBottom: "calc(env(safe-area-inset-bottom) + 1rem)" }
  });
  // canClose() returning false aborts the close (used by chip-multi pickers
  // to confirm discard of unsaved changes). Force-close skips the guard.
  function close({ force = false } = {}) {
    if (!force && opts.canClose && !opts.canClose()) return;
    backdrop.remove();
    opts.onClose && opts.onClose();
  }
  const head = el("div", { class: "flex items-start justify-between mb-3 gap-2" }, [
    el("div", { class: "min-w-0" }, [
      opts.subtitle ? el("div", { class: "t-micro text-mute" }, [opts.subtitle]) : null,
      el("h2", { class: "t-body text-ink mt-1 truncate" }, [opts.title])
    ]),
    el("button", { class: "text-mute text-xl px-2 -mt-1", onClick: () => close() }, ["×"])
  ]);
  sheet.appendChild(head);
  if (opts.body) sheet.appendChild(opts.body);
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
  return { close, sheet };
}

const CHEVRON_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-block"><path d="M9 6l6 6-6 6"/></svg>';

// settingsRow — tappable label/value/chevron row. Pass interactive=false for read-only.
function settingsRow({ label, value, onClick, interactive = true, danger = false }) {
  const node = el(interactive ? "button" : "div", {
    class: `w-full flex items-center justify-between gap-3 py-3 px-4 ${interactive ? "active:bg-surface2 hover:bg-surface2/60" : ""} ${danger ? "text-danger" : ""}`,
    onClick: interactive ? onClick : null
  });
  node.appendChild(el("span", { class: `t-body ${danger ? "text-danger" : "text-ink"}` }, [label]));
  const right = el("span", { class: "flex items-center gap-2 shrink-0" });
  if (value != null) right.appendChild(el("span", { class: `t-body ${danger ? "text-danger/80" : "text-mute"} truncate max-w-[10rem] text-right` }, [String(value)]));
  if (interactive && !danger) {
    const chev = el("span", { class: "text-mute" });
    chev.innerHTML = CHEVRON_SVG;
    right.appendChild(chev);
  }
  node.appendChild(right);
  return node;
}

// settingsGroup — grouped card of rows with a t-micro uppercase header and optional helper line below the card.
function settingsGroup({ title, rows, helper }) {
  const card = el("div", { class: "bg-card border border-hairline rounded-md overflow-hidden" });
  rows.filter(Boolean).forEach((r, i) => {
    if (i > 0) card.appendChild(el("div", { class: "border-t border-hairline mx-4" }));
    card.appendChild(r);
  });
  return el("section", { class: "mb-6" }, [
    el("h3", { class: "t-micro text-mute mb-2 px-1" }, [title]),
    card,
    helper ? el("p", { class: "t-meta text-mute mt-2 px-1" }, [helper]) : null
  ]);
}

// chipSelectStaged — toggle-only (no persistence). The caller commits the
// final set explicitly (e.g. via a Save button). Returns { row, isDirty }.
// onToggle fires on every tap so the caller can update the Save button state.
function chipSelectStaged(options, set, labelFn, onToggle) {
  const row = el("div", { class: "flex flex-wrap gap-2" });
  function rebuild() {
    row.innerHTML = "";
    options.forEach(opt => {
      const active = set.has(opt);
      row.appendChild(el("button", {
        class: `px-3 py-2 rounded-sm border text-sm ${active ? "border-accent text-accent bg-accent/10" : "border-hairline text-mute"}`,
        onClick: () => {
          if (active) set.delete(opt); else set.add(opt);
          onToggle && onToggle();
          rebuild();
        }
      }, [labelFn(opt)]));
    });
  }
  rebuild();
  return row;
}

function openRadioPicker({ subtitle, title, options, current, labelFn, onPick, helper }) {

function openStepperPicker({ subtitle, title, value, min, max, step = 1, suffix, onChange, helper }) {
  const body = el("div");
  let v = value;
  const display = el("div", { class: "num text-ink text-center", style: { fontSize: "32px", lineHeight: "1.1" } }, [`${v}${suffix ? " " + suffix : ""}`]);
  const stepper = el("div", { class: "flex items-center gap-2 bg-surface2 rounded-sm p-1 mt-3" }, [
    el("button", { class: "w-12 h-12 rounded-sm text-mute text-2xl", onClick: () => { v = Math.max(min, v - step); display.textContent = `${v}${suffix ? " " + suffix : ""}`; onChange(v); } }, ["−"]),
    el("div", { class: "flex-1" }),
    el("button", { class: "w-12 h-12 rounded-sm text-mute text-2xl", onClick: () => { v = Math.min(max, v + step); display.textContent = `${v}${suffix ? " " + suffix : ""}`; onChange(v); } }, ["+"])
  ]);
  body.appendChild(display);
  body.appendChild(stepper);
  if (helper) body.appendChild(el("p", { class: "t-meta text-mute mt-3" }, [helper]));

// Multi-select chip sheet with explicit Save / Cancel safety net.
// `initial` is the committed Set (state). The sheet works on a clone so
// closing without Save leaves nothing changed. onSave receives the new array.
function openChipMultiPicker({ subtitle, title, options, initial, labelFn, helper, onSave }) {
  const draft = new Set(initial);
  const initialKey = [...initial].sort().join("|");
  const isDirty = () => [...draft].sort().join("|") !== initialKey;

  const body = el("div");
  const helperLine = helper ? el("p", { class: "t-meta text-mute mt-3" }, [helper]) : null;

  // Footer — Save / Cancel; visible only when there are pending changes.
  const footer = el("div", { class: "mt-4 grid grid-cols-2 gap-2 hidden" });
  let sheetRef;
  function rebuildFooter() {
    footer.innerHTML = "";
    if (!isDirty()) { footer.classList.add("hidden"); return; }
    footer.classList.remove("hidden");
    footer.appendChild(el("button", {
      class: "h-12 rounded-sm bg-surface2 text-mute t-body",
      onClick: () => sheetRef.close({ force: true })   // explicit cancel — discard, no confirm
    }, ["Cancel"]));
    footer.appendChild(el("button", {
      class: "h-12 rounded-sm bg-accent text-accentInk t-body font-semibold",
      onClick: () => {
        onSave([...draft]);
        sheetRef.close({ force: true });
        render();
      }
    }, ["Save changes"]));
  }

  body.appendChild(chipSelectStaged(options, draft, labelFn, rebuildFooter));
  if (helperLine) body.appendChild(helperLine);
  body.appendChild(footer);

  // canClose: when dirty, dismissal via × or backdrop tap requires confirm.
  // Save and Cancel buttons close via { force: true } so they bypass this guard.
  sheetRef = openSheet({
    subtitle, title, body,
    canClose: () => !isDirty() || confirm("Discard your changes?")
  });
}

function openVideoPicksSheet() {

        catch { prompt("Copy this JSON:", json); }

      class: "px-4 h-12 rounded-sm bg-danger/10 text-danger t-body border border-danger/30",
      onClick: () => {
        if (!confirm("Clear all your video picks?")) return;

function openBackupSheet() {
  const body = el("div");
  body.appendChild(el("p", { class: "t-meta text-mute mb-3" }, [
    "Export everything — profile, sessions, history, video picks — as a JSON blob. Paste it back on any device to restore."
  ]));
  body.appendChild(el("div", { class: "flex gap-2" }, [
    el("button", {
      class: "flex-1 h-12 rounded-sm bg-surface2 t-body text-ink",
      onClick: async () => {
        const blob = JSON.stringify(STATE, null, 2);
        try { await navigator.clipboard.writeText(blob); alert("Backup copied to clipboard."); }
        catch { prompt("Copy this JSON:", blob); }
      }
    }, ["Export"]),
    el("button", {
      class: "flex-1 h-12 rounded-sm bg-surface2 t-body text-ink",
      onClick: () => {
        const raw = prompt("Paste a Cadence backup JSON to restore:");
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          if (!parsed.profile) throw new Error("Missing profile");
          if (!confirm("Replace all local data with this backup?")) return;
          STATE = { ...DEFAULT_STATE(), ...parsed };
          saveState(); render();
          alert("Restored.");
        } catch (e) { alert("Couldn't parse backup: " + e.message); }
      }
    }, ["Import"])
  ]));
  openSheet({ subtitle: "Backup", title: "Export & restore", body });
}

function openConfirmSheet({ subtitle, title, message, actionLabel, action }) {

    }, ["Cancel"]),

    }, [actionLabel])
  ]));

}

let __settingsAdvancedOpen = false;
let __settingsStaleDismissed = false; // session-scoped dismiss; resets on reload

function SettingsScreen() {
  const wrap = el("div");
  wrap.appendChild(appBar("Settings", { back: () => navigate("today") }));

  const profile = STATE.profile;
  const cardio = !(profile.disabledTypes || []).includes("cardio");
  const eqCount = (profile.equipment || []).length;
  const contraCount = (profile.contraindications || []).length;
  const ALL_TYPES = ["strength","mobility","cardio","flexibility","stability","power","rehab","warmup"];
  const enabledTypesCount = ALL_TYPES.length - (profile.disabledTypes || []).length;

  // ─── TRAINING ─────────────────────────────────────────────
  wrap.appendChild(settingsGroup({
    title: "Training",
    rows: [
      settingsRow({
        label: "Phase", value: PHASES[profile.phase].short,
        onClick: openPhasePicker
      }),
      settingsRow({
        label: "Goal", value: prettyEquipment(profile.goal) + " (for reference)",
        onClick: () => openRadioPicker({
          subtitle: "Goal", title: "What you're working toward",
          options: ["recomp","preserve","rebuild"],
          current: profile.goal,
          labelFn: prettyEquipment,
          onPick: v => { profile.goal = v; saveState(); },
          helper: "Recorded for context only — the engine doesn't use this directly."
        })
      }),
      settingsRow({
        label: "Frequency", value: `${profile.frequency} / wk (for reference)`,
        onClick: () => openStepperPicker({
          subtitle: "Frequency", title: "Sessions per week",
          value: profile.frequency, min: 2, max: 7,
          suffix: "/ wk",
          onChange: v => { profile.frequency = v; saveState(); },
          helper: "For reference only — actual day mapping comes from your phase."
        })
      }),
      settingsRow({
        label: "Session length", value: `${profile.sessionLength} min (for reference)`,
        onClick: () => openStepperPicker({
          subtitle: "Session length", title: "Target minutes per session",
          value: profile.sessionLength, min: 20, max: 90, step: 5,
          suffix: "min",
          onChange: v => { profile.sessionLength = v; saveState(); },
          helper: "For reference only — engine card durations are recipe-driven."
        })
      }),
      settingsRow({
        label: "Doing cardio", value: cardio ? "Yes" : "No",
        interactive: false
      })
    ],
    helper: "Phase changes regenerate downstream."
  }));

  // ─── POOL ─────────────────────────────────────────────────
  wrap.appendChild(settingsGroup({
    title: "Pool",
    rows: [
      settingsRow({
        label: "Equipment", value: `${eqCount} selected`,
        onClick: () => openChipMultiPicker({
          subtitle: "Equipment", title: "What you have access to",
          options: DEFAULT_EQUIPMENT,
          initial: new Set(profile.equipment),
          labelFn: prettyEquipment,
          onSave: arr => { profile.equipment = arr; invalidateToday(); saveState(); }
        })
      }),
      settingsRow({
        label: "Contraindications", value: `${contraCount} active`,
        onClick: () => openChipMultiPicker({
          subtitle: "Contraindications", title: "Active flags filter the pool silently",
          options: DEFAULT_CONTRAINDICATIONS,
          initial: new Set(profile.contraindications),
          labelFn: prettyContra,
          onSave: arr => { profile.contraindications = arr; invalidateToday(); saveState(); },
          helper: "Anything tagged with one of these is suppressed from your plan."
        })
      }),
      settingsRow({
        label: "Exercise types", value: `${enabledTypesCount} enabled`,
        onClick: () => openChipMultiPicker({
          subtitle: "Exercise types", title: "Categories you're currently doing",
          options: ALL_TYPES,
          initial: new Set(ALL_TYPES.filter(t => !(profile.disabledTypes || []).includes(t))),
          labelFn: prettyType,
          onSave: arr => {
            profile.disabledTypes = ALL_TYPES.filter(t => !arr.includes(t));
            invalidateToday(); saveState();
          },
          helper: "Toggling Cardio off removes all cardio-tagged exercises from your plan."
        })
      })
    ],
    helper: "These filter your exercise pool silently."
  }));

  // ─── CLINICAL CONTEXT (read-only) ─────────────────────────
  // Displays whatever the seed _meta carries: last clinical update,
  // shoulder + ankle diagnoses, source clinics, status. The stale-data
  // nudge sits inside this group so the related info stays clustered.
  const lastClin = SEED_META.last_clinical_update;
  const dx = SEED_META.diagnoses_basis || {};
  if (lastClin || Object.keys(dx).length) {
    const fmtDate = iso => new Date(iso + "T00:00:00")
      .toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });

    const clinicalRows = [];

    // Stale nudge first — only when > 90 days old and not session-dismissed.
    if (lastClin && !__settingsStaleDismissed) {
      const ageDays = Math.floor((Date.now() - new Date(lastClin + "T00:00:00").getTime()) / 86400000);
      if (ageDays > 90) {
        clinicalRows.push(el("div", { class: "py-3 px-4 flex items-start justify-between gap-2" }, [
          el("p", { class: "t-meta text-mute" }, [
            "Consider a clinical re-evaluation. The data on this screen is over 90 days old."
          ]),
          el("button", {
            class: "t-meta text-mute shrink-0",
            onClick: () => { __settingsStaleDismissed = true; render(); }
          }, ["Dismiss"])
        ]));
      }
    }

    // Last update
    if (lastClin) {
      clinicalRows.push(el("div", { class: "py-3 px-4 flex items-center justify-between gap-3" }, [
        el("span", { class: "t-body text-ink" }, ["Last update"]),
        el("span", { class: "t-body text-mute num" }, [fmtDate(lastClin)])
      ]));
    }

    // One block per diagnosis. Schema-tolerant: render whatever fields exist.
    function diagnosisBlock(label, d) {
      if (!d) return null;
      const rows = [el("div", { class: "t-body text-ink" }, [label])];
      // Field order: condition → findings → status → source. Anything else
      // unknown gets rendered after, so the block adapts if the schema grows.
      const ORDER = ["condition", "findings", "status", "source"];
      const seen = new Set();
      for (const k of ORDER) {
        if (d[k]) { rows.push(el("div", { class: "t-meta text-mute" }, [d[k]])); seen.add(k); }
      }
      for (const [k, v] of Object.entries(d)) {
        if (seen.has(k) || typeof v !== "string") continue;
        rows.push(el("div", { class: "t-meta text-mute" }, [`${k}: ${v}`]));
      }
      return el("div", { class: "py-3 px-4 space-y-1" }, rows);
    }
    if (dx.shoulder) clinicalRows.push(diagnosisBlock("Shoulder", dx.shoulder));
    if (dx.ankle) clinicalRows.push(diagnosisBlock("Ankle", dx.ankle));
    // Render any other diagnosis keys that show up later (e.g. dx.knee).
    for (const [k, d] of Object.entries(dx)) {
      if (k === "shoulder" || k === "ankle") continue;
      const label = k.charAt(0).toUpperCase() + k.slice(1);
      clinicalRows.push(diagnosisBlock(label, d));
    }

    wrap.appendChild(settingsGroup({
      title: "Clinical context",
      rows: clinicalRows.filter(Boolean),
      helper: "Read-only — what the engine is using to filter your exercise pool."
    }));
  }

  // ─── MESOCYCLE (status only) ──────────────────────────────
  const restCount = (STATE.restDays || []).length;
  const skew = STATE.daySkew || 0;
  const startDateText = new Date(STATE.mesocycle.startDate + "T00:00:00")
    .toLocaleDateString(undefined, { day: "numeric", month: "short" });
  const statusBits = [
    `Started ${startDateText}`,
    `${restCount} rest day${restCount === 1 ? "" : "s"}`
  ];
  if (skew > 0) statusBits.push(`schedule shifted by ${skew} day${skew === 1 ? "" : "s"}`);
  wrap.appendChild(settingsGroup({
    title: "Mesocycle",
    rows: [
      el("div", { class: "py-3 px-4" }, [
        el("div", { class: "t-body text-ink" }, [
          `Week ${STATE.mesocycle.currentWeek} of 5${isDeloadWeek() ? " · Deload" : ""}`
        ]),
        el("div", { class: "t-meta text-mute mt-0.5" }, [statusBits.join(" · ")])
      ])
    ]
  }));

  // ─── DATA ─────────────────────────────────────────────────
  const overridesCount = Object.keys(STATE.videoOverrides || {}).length;
  wrap.appendChild(settingsGroup({
    title: "Data",
    rows: [
      settingsRow({
        label: "Sync",
        value: fbReady && fbUid ? "Connected ✓" : "Local only",
        interactive: false
      }),
      settingsRow({
        label: "Backup", value: "Export",
        onClick: openBackupSheet
      }),
      settingsRow({
        label: "Video picks", value: `${overridesCount} saved`,
        onClick: openVideoPicksSheet
      })
    ]
  }));

  // ─── ADVANCED ─────────────────────────────────────────────
  const advCard = el("div", { class: "bg-card border border-hairline rounded-md overflow-hidden mb-6" });
  const advToggle = el("button", {
    class: "w-full flex items-center justify-between gap-3 py-3 px-4 active:bg-surface2 hover:bg-surface2/60",
    onClick: () => { __settingsAdvancedOpen = !__settingsAdvancedOpen; render(); }
  });
  advToggle.appendChild(el("span", { class: "t-body text-ink" }, ["Advanced"]));
  const advChev = el("span", { class: "text-mute" });
  advChev.innerHTML = __settingsAdvancedOpen
    ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
    : CHEVRON_SVG;
  advToggle.appendChild(advChev);
  advCard.appendChild(advToggle);

  if (__settingsAdvancedOpen) {
    const advRows = [
      settingsRow({
        label: "Realign with weekdays",
        value: skew > 0 ? `${skew} day${skew === 1 ? "" : "s"} off` : "Aligned",
        onClick: () => {
          if (skew === 0) { alert("Schedule is already aligned with weekdays."); return; }
          openConfirmSheet({
            subtitle: "Advanced", title: "Realign with weekdays",
            message: `Reset the day-skew to 0 — the engine's Mon–Sun mapping will apply again from today. Recorded rest days stay in your history.`,
            actionLabel: "Realign",
            action: () => {
              STATE.daySkew = 0;
              invalidateToday();
              saveState();
            }
          });
        }
      }),
      settingsRow({
        label: "Reset to Week 1", danger: true,
        onClick: () => openConfirmSheet({
          subtitle: "Advanced", title: "Reset mesocycle to Week 1",
          message: "Restarts the 5-week mesocycle from today. Sessions and history are kept.",
          actionLabel: "Reset to Week 1",
          action: () => {
            STATE.mesocycle.startDate = todayISO();
            STATE.mesocycle.currentWeek = 1;
            invalidateToday();
            saveState();
          }
        })
      }),
      settingsRow({
        label: isDeloadWeek() ? "Skip deload" : "Force deload", danger: true,
        onClick: () => openConfirmSheet({
          subtitle: "Advanced", title: isDeloadWeek() ? "Skip the current deload" : "Force a deload week",
          message: isDeloadWeek()
            ? "Jumps the mesocycle out of the current deload back to Week 1."
            : "Jumps the mesocycle to Week 5 (deload). Volume × 0.6, load × 0.7 for one week.",
          actionLabel: isDeloadWeek() ? "Skip deload" : "Force deload",
          action: () => {
            const target = isDeloadWeek() ? 1 : 5;
            const offsetDays = (target - 1) * 7;
            STATE.mesocycle.startDate = localISO(new Date(Date.now() - offsetDays * 86400000));
            STATE.mesocycle.currentWeek = target;
            invalidateToday();
            saveState();
          }
        })
      }),
      settingsRow({
        label: "Reset all data", danger: true,
        onClick: () => openConfirmSheet({
          subtitle: "Advanced", title: "Reset all local data",
          message: "Wipes profile, sessions, history, video picks, and rest days from this device. Firestore copy (if synced) stays — re-launching will pull it back. Use Backup → Export first if you might want this back.",
          actionLabel: "Reset all data",
          action: () => {
            localStorage.removeItem(LS_KEY);
            STATE = DEFAULT_STATE();
          }
        })
      })
    ];
    advRows.forEach((r, i) => {
      if (i > 0) advCard.appendChild(el("div", { class: "border-t border-hairline mx-4" }));
      advCard.appendChild(r);
    });
  }

  wrap.appendChild(advCard);

  return wrap;
}

// Boot
//-----------------------------------------------------------------------------

(async function boot() {
  try {
    EXERCISES = await loadExerciseSeed();
  } catch (e) {
    console.error("[Cadence] Failed to load exercise seed", e);
    root.innerHTML = `<div class="p-6 text-danger">Failed to load exercise database.</div>`;
    return;
  }

  await initFirebase();
  if (fbReady) {
    try { await seedFirestoreIfNeeded(EXERCISES); } catch (e) { console.warn(e); }
    await pullRemoteState();
  }

  refreshMesocycleWeek();
  render();
