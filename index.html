//=============================================================================
// Cadence v1 — single-file PWA. PRD: cadence-prd.md
//=============================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

//-----------------------------------------------------------------------------
// Constants — see PRD §5, §6, §8
//-----------------------------------------------------------------------------

const PHASES = {
  0: { label: "Phase 0 — Preserve & Rehab", short: "Phase 0",
       weekly: "3 light resistance + 2 recovery", volume: [10,12], deloadAllowed: true },
  1: { label: "Phase 1 — Rebuild", short: "Phase 1",

  2: { label: "Phase 2 — Recomp", short: "Phase 2",
       weekly: "5 resistance, mobility in warmups", volume: [16,20], deloadAllowed: true }
};

// JS getDay(): 0=Sun, 1=Mon, ... 6=Sat
const DAY_TABLE = {
  0: { 1: "light_lower", 2: "recovery", 3: "posterior_scap", 4: "recovery", 5: "light_lower_push", 6: "off", 0: "off" },
  1: { 1: "lower", 2: "push_modified", 3: "recovery", 4: "pull_modified", 5: "full_body", 6: "off", 0: "off" },
  2: { 1: "push", 2: "pull", 3: "legs", 4: "upper", 5: "lower", 6: "off", 0: "off" }
};

const CARD_META = {
  light_lower:       { title: "Light Lower",        duration: 35, kind: "resistance" },
  posterior_scap:    { title: "Posterior + Scap",   duration: 40, kind: "resistance" },
  light_lower_push:  { title: "Light Lower + Push", duration: 40, kind: "resistance" },
  recovery:          { title: "Recovery",           duration: 25, kind: "recovery" },
  lower:             { title: "Lower",              duration: 50, kind: "resistance" },
  push_modified:     { title: "Push (modified)",    duration: 50, kind: "resistance" },
  pull_modified:     { title: "Pull (modified)",    duration: 50, kind: "resistance" },
  full_body:         { title: "Full Body",          duration: 55, kind: "resistance" },
  push:              { title: "Push",               duration: 60, kind: "resistance" },
  pull:              { title: "Pull",               duration: 60, kind: "resistance" },
  legs:              { title: "Legs",               duration: 60, kind: "resistance" },
  upper:             { title: "Upper",              duration: 55, kind: "resistance" },
  off:               { title: "Off Day",            duration: 0,  kind: "off" },
  rest:              { title: "Rest Day",           duration: 0,  kind: "rest" }
};

const isRestDay = (iso) => (STATE.restDays || []).includes(iso);

// Card type → category targets (count of exercise slots from each category, in order)
// Recipe slot syntax:
//   [category, count, opts]
//   - category: a string matching ex.category, OR "*" with opts.byTypes for tag-based selection
//   - count: number of exercises to pull
//   - opts.byTypes: ["warmup"] selects from exercise_types tag instead of category
//   - opts.filter: "tricep" | "bicep"
//   - opts.isolation: true = prefer isolation/lower-fatigue picks
//   - opts.warmup: true = mark as warmup block (1 set, no progression, skip in deload)
//   - opts.optional: true = OK if pool can't fill it (e.g. warmup gracefully degrades)
//
// Resistance days now lead with a warmup slot and end with a core slot.
const CARD_RECIPES = {
  light_lower:       [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["quad_dominant", 2, {}], ["hinge_posterior", 1, {}], ["calf_lower_leg", 1, {}], ["core", 1, {}]],
  light_lower_push:  [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["quad_dominant", 1, {}], ["hinge_posterior", 1, {}], ["scap_postural", 2, {}], ["calf_lower_leg", 1, {}], ["core", 1, {}]],
  posterior_scap:    [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["scap_postural", 3, {}], ["horizontal_pull", 1, {}], ["physio_specific", 1, {}], ["core", 1, {}]],
  recovery:          [["recovery_mobility", 2, {}], ["mobility_movement", 2, {}], ["yoga_asana", 1, {}], ["physio_specific", 2, {}]],

  lower:             [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["quad_dominant", 2, {}], ["hinge_posterior", 2, {}], ["calf_lower_leg", 1, {}], ["core", 1, {}]],
  push_modified:     [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["horizontal_push", 2, {}], ["vertical_push", 1, {}], ["arms_isolation", 2, { filter: "tricep" }], ["core", 1, {}]],
  pull_modified:     [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["horizontal_pull", 2, {}], ["vertical_pull", 1, {}], ["arms_isolation", 2, { filter: "bicep" }], ["core", 1, {}]],
  full_body:         [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["quad_dominant", 1, {}], ["hinge_posterior", 1, {}], ["horizontal_push", 1, {}], ["horizontal_pull", 1, {}], ["scap_postural", 1, {}], ["core", 1, {}]],

  push:              [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["horizontal_push", 2, {}], ["vertical_push", 1, {}], ["horizontal_push", 1, { isolation: true }], ["arms_isolation", 2, { filter: "tricep" }], ["core", 1, {}]],
  pull:              [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["horizontal_pull", 2, {}], ["vertical_pull", 1, {}], ["scap_postural", 1, {}], ["arms_isolation", 2, { filter: "bicep" }], ["core", 1, {}]],
  legs:              [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["quad_dominant", 2, {}], ["hinge_posterior", 2, {}], ["quad_dominant", 1, { isolation: true }], ["calf_lower_leg", 1, {}], ["core", 1, {}]],
  upper:             [["*", 1, { byTypes: ["warmup"], warmup: true, optional: true }],
                      ["horizontal_push", 1, {}], ["horizontal_pull", 1, {}], ["vertical_push", 1, {}], ["vertical_pull", 1, {}], ["scap_postural", 1, {}], ["arms_isolation", 1, {}], ["core", 1, {}]]
};

const RECOVERY_BLOCK = [
  { id: "_rec_foamroll", name: "Foam roll: thoracic, lats, glutes", durationMin: 8, kind: "recovery" },
  { id: "_rec_ice",      name: "Ice / contrast: shoulder + ankle",  durationMin: 10, kind: "recovery" }
];

const DEFAULT_CONTRAINDICATIONS = ["right_anterior_shoulder", "right_ankle_insertional_loading"];
const DEFAULT_EQUIPMENT = ["adjustable_dumbbells","barbell_plates","adjustable_bench","pull_up_bar","resistance_bands","cable_machine","foam_roller","yoga_mat","bodyweight"];

// When a recipe slot can't be filled (often because contraindications wiped the
// primary pool), draw from these related categories in order.
const RELATED_CATEGORIES = {
  horizontal_push: ["scap_postural", "core"],
  vertical_push:   ["scap_postural"],
  horizontal_pull: ["scap_postural"],
  vertical_pull:   ["scap_postural"],
  quad_dominant:   ["hinge_posterior", "calf_lower_leg"],
  hinge_posterior: ["quad_dominant"],
  arms_isolation:  ["scap_postural", "core"],
  core:            ["physio_specific"],
  recovery_mobility: ["mobility_movement", "yoga_asana"],
  mobility_movement: ["recovery_mobility", "yoga_asana"],
  yoga_asana:      ["recovery_mobility"],
  scap_postural:   ["physio_specific"],
  physio_specific: ["recovery_mobility"]
};

//-----------------------------------------------------------------------------
// Storage (local mirror) + Firestore client
//-----------------------------------------------------------------------------

const LS_KEY = "cadence:v1";
const LS = {
  load() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } },
  save(s) { localStorage.setItem(LS_KEY, JSON.stringify(s)); }
};

let fbReady = false, fbApp = null, fbAuth = null, fbDb = null, fbUid = null;

function fbConfigured() {
  const c = window.__CADENCE_FIREBASE__ || {};
  return !!(c.apiKey && !c.apiKey.startsWith("YOUR_") && c.projectId && !c.projectId.startsWith("YOUR_"));
}

async function initFirebase() {
  if (!fbConfigured()) { console.info("[Cadence] No Firebase config — running local-only."); return; }
  try {
    fbApp = initializeApp(window.__CADENCE_FIREBASE__);
    fbAuth = getAuth(fbApp); fbDb = getFirestore(fbApp);
    await new Promise((res, rej) => {
      const unsub = onAuthStateChanged(fbAuth, async (u) => {
        if (u) { fbUid = u.uid; unsub(); fbReady = true; res(); }
      });
      signInAnonymously(fbAuth).catch(rej);
    });
  } catch (e) { console.warn("[Cadence] Firebase init failed; local-only.", e); fbReady = false; }
}

//-----------------------------------------------------------------------------
// Seeding (PRD §17.2 — embed JSON, write on first launch)
//-----------------------------------------------------------------------------

let EXERCISES = []; // canonical in-memory pool
let SEED_META = {}; // captured from seed _meta at boot — version, last_clinical_update, etc.

async function loadExerciseSeed() {
  const res = await fetch("/data/v1-exercise-seed.json", { cache: "force-cache" });
  const json = await res.json();
  SEED_META = json._meta || {};
  return json.exercises || [];
}

async function seedFirestoreIfNeeded(seed) {
  if (!fbReady) return;
  const meta = await getDoc(doc(fbDb, "system", "seed"));
  if (meta.exists() && meta.data().version === "2.4") return;
  // Batch write all exercises
  const chunks = [];
  for (let i = 0; i < seed.length; i += 400) chunks.push(seed.slice(i, i + 400));
  for (const chunk of chunks) {
    const batch = writeBatch(fbDb);
    chunk.forEach(ex => batch.set(doc(fbDb, "exercises", ex.id), ex));
    await batch.commit();
  }
  await setDoc(doc(fbDb, "system", "seed"), { version: "2.4", seededAt: serverTimestamp(), count: seed.length });
  console.info(`[Cadence] Seeded ${seed.length} exercises to Firestore.`);
}

//-----------------------------------------------------------------------------
// User state — single source of truth, persisted to LS, mirrored to Firestore
//-----------------------------------------------------------------------------

// Local-date ISO (YYYY-MM-DD). Critical: never use toISOString().slice(0,10)
// for "today" — that returns UTC, which rolls a day early in IST/+5:30 etc.
function localISO(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
const todayISO = () => localISO();

const DEFAULT_STATE = () => ({
  setupDone: false,
  profile: {
    goal: "recomp",
    phase: 0,
    frequency: 5,
    sessionLength: 45,
    equipment: [...DEFAULT_EQUIPMENT],
    contraindications: [...DEFAULT_CONTRAINDICATIONS],
    disabledTypes: ["cardio"]
  },
  mesocycle: { startDate: todayISO(), currentWeek: 1 }, // week 1..5; 5 = deload
  daySkew: 0, // increments on "Rest today" — shifts planned split forward
  restDays: [], // ISO dates the user has tagged as rest
  todayOverride: null, // { date: ISO, cardType: "lower" } — manual override for today's plan
  sessions: {}, // sessionId → session record (also synced)
  exerciseHistory: {}, // exerciseId → { lastDate, lastLoad, lastReps, symptomFlagCount, lastCardType }
  videoOverrides: {}, // exerciseId → preferred YouTube URL (user override, syncs)
  updatedAt: 0
});

let STATE = LS.load();
if (!STATE || !STATE.profile) STATE = DEFAULT_STATE();

function saveState({ remote = true } = {}) {
  STATE.updatedAt = Date.now();
  LS.save(STATE);
  if (remote && fbReady && fbUid) {
    setDoc(doc(fbDb, "users", fbUid), {
      profile: STATE.profile,
      mesocycle: STATE.mesocycle,
      daySkew: STATE.daySkew,
      restDays: STATE.restDays || [],
      todayOverride: STATE.todayOverride || null,
      setupDone: STATE.setupDone,
      exerciseHistory: STATE.exerciseHistory,
      videoOverrides: STATE.videoOverrides || {},
      updatedAt: STATE.updatedAt
    }, { merge: true }).catch(e => console.warn("[Cadence] sync user failed", e));
  }
}

async function pullRemoteState() {
  if (!fbReady || !fbUid) return;
  try {
    const snap = await getDoc(doc(fbDb, "users", fbUid));
    if (!snap.exists()) return;
    const remote = snap.data();
    if ((remote.updatedAt || 0) > (STATE.updatedAt || 0)) {
      // Last-write-wins (PRD §16)
      STATE = { ...STATE, ...remote, sessions: STATE.sessions || {} };
      LS.save(STATE);
    }
    // Pull recent sessions
    const sessSnap = await getDocs(collection(fbDb, "sessions", fbUid, "items"));
    sessSnap.forEach(d => { const s = d.data(); STATE.sessions[d.id] = s; });
    LS.save(STATE);
  } catch (e) { console.warn("[Cadence] pullRemoteState", e); }
}

async function syncSession(session) {
  if (!fbReady || !fbUid) return;
  try {
    await setDoc(doc(fbDb, "sessions", fbUid, "items", session.id), session);
  } catch (e) { console.warn("[Cadence] syncSession", e); }
}

//-----------------------------------------------------------------------------
// Mesocycle bookkeeping
//-----------------------------------------------------------------------------

function refreshMesocycleWeek() {
  const start = new Date(STATE.mesocycle.startDate + "T00:00:00");
  const days = Math.floor((Date.now() - start.getTime()) / 86400000);
  const week = ((Math.floor(days / 7)) % 5) + 1; // 1..5
  if (week !== STATE.mesocycle.currentWeek) {
    STATE.mesocycle.currentWeek = week;
    saveState();
  }
}

const isDeloadWeek = () => STATE.mesocycle.currentWeek === 5;

//-----------------------------------------------------------------------------
// THE ENGINE — PRD §8
//-----------------------------------------------------------------------------

function dayCardType(date = new Date()) {
  const phase = STATE.profile.phase;
  const dow = date.getDay();
  // Apply daySkew (positive = shift forward)
  const skew = STATE.daySkew || 0;
  const effective = ((dow - 1 + skew) % 7 + 7) % 7 + 1; // re-bias so Mon=1
  const map = DAY_TABLE[phase];
  // map keys are 0..6; we re-assemble using the skewed dow
  const realDow = (dow + skew) % 7;
  return map[realDow] || "off";
}

// 1. Filter pool by phase / equipment / contraindications / rotation
function filterPool(cardType, opts = {}) {
  const phase = STATE.profile.phase;
  const equip = new Set(STATE.profile.equipment);
  const contras = new Set(STATE.profile.contraindications);
  const disabledTypes = new Set(STATE.profile.disabledTypes || []);
  const recentlyUsed = opts.allowRecent ? new Set() : recentExerciseIds(cardType, 2);

  return EXERCISES.filter(ex => {
    // Deprecated entries stay in the seed for history but never enter selection.
    if (ex.deprecated) return false;
    if (!ex.phase_eligibility?.includes(phase)) return false;
    if (!ex.equipment_required?.every(e => equip.has(e))) return false;
    if (ex.contraindication_tags?.some(t => contras.has(t))) return false;
    // exercise_types intersection with disabled set excludes the exercise.
    if ((ex.exercise_types || []).some(t => disabledTypes.has(t))) return false;
    if (opts.excludeIds && opts.excludeIds.has(ex.id)) return false;
    if (recentlyUsed.has(ex.id)) return false;
    return true;
  });
}

function recentExerciseIds(cardType, lastN) {
  const sessions = Object.values(STATE.sessions)
    .filter(s => s.cardType === cardType && s.completedAt)
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0))
    .slice(0, lastN);
  const ids = new Set();
  sessions.forEach(s => (s.planned || []).forEach(p => ids.add(p.exerciseId)));
  return ids;
}

// 2. Selection — compound first, prefer not-recently-used, low-fatigue tiebreak.
// Slot category may be "*" meaning "any", with opts.byTypes pulling from exercise_types.
function selectFromCategory(pool, category, count, opts = {}) {
  let candidates;
  if (opts.byTypes && opts.byTypes.length) {
    const wanted = new Set(opts.byTypes);
    candidates = pool.filter(ex => (ex.exercise_types || []).some(t => wanted.has(t)));
  } else {
    candidates = pool.filter(ex => ex.category === category);
  }
  if (opts.filter === "tricep") candidates = candidates.filter(ex => /tricep|pushdown|skull|overhead/i.test(ex.name) || ex.primary_movers?.includes("triceps"));
  if (opts.filter === "bicep")  candidates = candidates.filter(ex => /curl/i.test(ex.name) || ex.primary_movers?.includes("biceps"));
  if (opts.isolation) candidates = candidates.filter(ex => ex.fatigue_cost === "low" || /fly|extension|curl|raise|pushdown/i.test(ex.name));
  // For warmup picks, prefer low-fatigue movement-based options first; otherwise compound-first.
  if (opts.warmup) {
    candidates.sort((a, b) => fatigueRank(a) - fatigueRank(b));
  } else {
    candidates.sort((a, b) => fatigueRank(b) - fatigueRank(a));
  }
  // Pick up to count, avoiding duplicates
  const picked = [];
  const seen = new Set();
  for (const ex of candidates) {
    if (picked.length >= count) break;
    if (seen.has(ex.id)) continue;
    picked.push(ex); seen.add(ex.id);
  }
  return picked;
}

function fatigueRank(ex) { return ({ high: 3, medium: 2, low: 1 })[ex.fatigue_cost] || 1; }

// 3. Sets per exercise
function setsForExercise(ex, cardType, slotOpts = {}) {
  const phase = STATE.profile.phase;
  const isResistance = CARD_META[cardType]?.kind === "resistance";
  // Warmup blocks are always a single set; volume here doesn't count toward working sets.
  if (slotOpts.warmup) return 1;
  if (!isResistance) return 1;
  // Core slot is light by default — 2 sets — to keep working-set volume in PRD bands.
  const isCore = ex.category === "core" || ex.category === "physio_specific";
  let base = phase === 0 ? 3 : phase === 1 ? 3 : 4;
  if (isCore) base = 2;
  if (ex.fatigue_cost === "low" && !isCore) base = Math.max(2, base - 1);
  if (isDeloadWeek()) base = Math.max(2, Math.round(base * 0.6));
  return base;
}

// 4. Load prescription — PRD §8.5
function prescribeLoad(ex) {
  const hist = STATE.exerciseHistory[ex.id];
  const repRange = ex.rep_ranges?.[`phase_${STATE.profile.phase}`] || [8,12];
  if (!hist || hist.lastLoad == null) return { load: null, reps: repRange, note: "No history" };
  const compound = ex.fatigue_cost === "high" || ex.fatigue_cost === "medium";
  let load = hist.lastLoad;
  let note = "Hold";

  if ((hist.symptomFlagCount || 0) >= 2) return { load, reps: repRange, note: "Substitute due to repeated symptom", substitute: true };
  if (hist.lastSymptomFlag) { note = "Hold (symptom last session)"; }
  else if (hist.lastReps != null && hist.lastReps >= repRange[1]) {
    load += compound ? 2.5 : 1;
    note = compound ? "+2.5 kg" : "+1 kg";
  }
  if (isDeloadWeek()) { load = Math.round(load * 0.7 * 2) / 2; note = "Deload (×0.7)"; }
  return { load, reps: repRange, note };
}

// 5. Generate today's session
function generateSession(date = new Date()) {
  refreshMesocycleWeek();
  const iso = localISO(date);
  const isToday = iso === todayISO();

  // Manual override (Today only): user picked a different card for today.
  // Override beats rest-day and engine's day-type lookup.
  let cardType;
  if (isToday && STATE.todayOverride && STATE.todayOverride.date === iso) {
    cardType = STATE.todayOverride.cardType;
  } else if (isRestDay(iso)) {
    return { id: sessionIdFor(date), date: iso, cardType: "rest", planned: [], recovery: [], meta: CARD_META.rest };
  } else {
    cardType = dayCardType(date);
  }

  const meta = CARD_META[cardType];
  if (!meta || meta.kind === "off") {
    return { id: sessionIdFor(date), date: iso, cardType, planned: [], recovery: [], meta };
  }

  const recipe = CARD_RECIPES[cardType] || [];
  const pool = filterPool(cardType);
  const planned = [];
  const usedIds = new Set();

  function pushPick(ex, slotOpts = {}) {
    usedIds.add(ex.id);
    const sets = setsForExercise(ex, cardType, slotOpts);
    const rx = slotOpts.warmup ? { load: null, reps: ex.rep_ranges?.[`phase_${STATE.profile.phase}`] || [10,12], note: "Warmup" } : prescribeLoad(ex);
    const isUnilateral = (ex.position_tags || []).includes("unilateral");
    planned.push({
      exerciseId: ex.id, name: ex.name, category: ex.category,
      sets: Array.from({ length: sets }, () => ({ reps: null, load: rx.load, completed: false })),
      repRange: rx.reps, prescribedLoad: rx.load, prescribedNote: rx.note,
      rest_seconds: slotOpts.warmup ? 30 : ex.rest_seconds,
      isPhysio: ex.is_physio || false, isWarmup: !!slotOpts.warmup,
      notes: ex.notes || "",
      cue: ex.cue || "",
      modality: ex.modality || "reps",
      unilateral: isUnilateral,
      videoUrl: ex.video_url || null,
      videoSource: ex.video_source || null,
      videoDurationSec: ex.video_duration_sec || null
    });
  }

  // Build a wider "no-recent" pool once, only used as a last-resort backfill.
  const noRecentPool = filterPool(cardType, { allowRecent: true });

  for (const [category, count, opts] of recipe) {
    const remaining = pool.filter(ex => !usedIds.has(ex.id));
    let picks = selectFromCategory(remaining, category, count, opts);
    // Tier 1 fallback: related categories within the recent-filtered pool.
    if (picks.length < count && !opts.byTypes) {
      for (const fb of (RELATED_CATEGORIES[category] || [])) {
        if (picks.length >= count) break;
        const fbRemaining = pool.filter(ex => !usedIds.has(ex.id) && !picks.find(p => p.id === ex.id));
        picks = picks.concat(selectFromCategory(fbRemaining, fb, count - picks.length, opts));
      }
    }
    // Tier 2 fallback: re-allow recently-used exercises (rotation < volume).
    if (picks.length < count) {
      const r2 = noRecentPool.filter(ex => !usedIds.has(ex.id) && !picks.find(p => p.id === ex.id));
      picks = picks.concat(selectFromCategory(r2, category, count - picks.length, opts));
      if (picks.length < count && !opts.byTypes) {
        for (const fb of (RELATED_CATEGORIES[category] || [])) {
          if (picks.length >= count) break;
          const r2fb = noRecentPool.filter(ex => !usedIds.has(ex.id) && !picks.find(p => p.id === ex.id));
          picks = picks.concat(selectFromCategory(r2fb, fb, count - picks.length, opts));
        }
      }
    }
    // Optional slots may legitimately stay empty (e.g. warmup if no warmup-tagged
    // exercise survived the user's contraindications and equipment).
    for (const ex of picks) pushPick(ex, opts);
  }

  // Recovery card already IS recovery — don't double-append the foam-roll/ice block.
  // For resistance days in Phase 0/1, append the mandatory recovery block (PRD §6).
  const recovery = (STATE.profile.phase < 2 && meta.kind === "resistance")
    ? RECOVERY_BLOCK.map(b => ({ ...b, completed: false }))
    : [];

  return {
    id: sessionIdFor(date),
    date: localISO(date),
    cardType, meta,
    deload: isDeloadWeek(),
    planned, recovery,
    startedAt: null, completedAt: null,
    sessionSymptomFlag: null
  };
}

const sessionIdFor = (date) => "s_" + localISO(date);

const root = document.getElementById("app");
const screens = { setup: SetupScreen, today: TodayScreen, session: SessionScreen, done: DoneScreen, settings: SettingsScreen };

function navigate(name, params = {}) {
  location.hash = "#" + name + (params._id ? ":" + params._id : "");
  render();
}

function currentRoute() {
  const h = (location.hash || "#today").slice(1);
  const [name, id] = h.split(":");
  return { name, id };
}

function render() {
  if (!STATE.setupDone) { mount(SetupScreen); return; }
  const { name } = currentRoute();
  const view = screens[name] || TodayScreen;
  mount(view);
}

function mount(view) {
  root.innerHTML = "";
  const node = view();
  node.classList.add("fadein");
  root.appendChild(node);
}

window.addEventListener("hashchange", render);

function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else n.setAttribute(k, v);
  }
  // Flatten nested arrays so children can be inline-conditional groups.
  const flat = (Array.isArray(children) ? children : [children]).flat(Infinity).filter(Boolean);
  for (const c of flat) {
    if (typeof c === "string" || typeof c === "number") n.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) n.appendChild(c);
    // silently skip anything else (truthy non-string non-Node) to avoid crashing the whole render
  }
  return n;
}

function iconBtn(svg, onClick, opts = {}) {

// Unified app bar: back (optional) + title + home (default) + extra right element.
// opts: { back: fn|null, home: fn|null|false, right: Node, subtitle: string }
function appBar(title, opts = {}) {
  const route = currentRoute().name || "today";
  const onSetup = !STATE.setupDone;
  // Left slot: opts.leftContent (raw Node) overrides the default back-button slot.
  // Width grows to fit when leftContent is provided so the wordmark isn't clipped.
  const left = el("div", {
    class: opts.leftContent
      ? "flex items-center gap-1 shrink-0"
      : "flex items-center gap-1 w-10"
  });
  if (opts.leftContent) left.appendChild(opts.leftContent);
  else if (opts.back) left.appendChild(iconBtn(ICONS.back, opts.back, { label: "Back" }));

  const center = el("div", { class: "flex-1 text-center min-w-0 px-2" }, [
    el("h1", { class: "t-body text-ink truncate" }, [title]),
    opts.subtitle ? el("div", { class: "t-meta text-mute truncate" }, [opts.subtitle]) : null
  ]);

  const right = el("div", { class: "flex items-center gap-1 justify-end w-10" });
  // Home: default to navigate("today"); suppress on Today and on Setup (gated flow).
  const homeFn = opts.home === false ? null
    : opts.home || (route === "today" || onSetup ? null : () => navigate("today"));
  if (opts.right) right.appendChild(opts.right);
  if (homeFn) right.appendChild(iconBtn(ICONS.home, homeFn, { label: "Home" }));

  return el("header", {
    class: "sticky top-0 -mx-4 px-4 py-2 mb-4 bg-bg/95 backdrop-blur z-30 border-b border-hairline flex items-center"
  }, [left, center, right]);
}

// Display a planned block's prescription line — modality-aware.
function prescriptionText(p) {
  const mod = p.modality || "reps";
  const [lo, hi] = p.repRange || [0,0];
  const range = lo === hi ? `${lo}` : `${lo}–${hi}`;
  const sideTag = p.unilateral ? " each side" : "";
  if (mod === "time")   return `${range} sec${sideTag}`;
  if (mod === "rounds") return `${range} rounds${sideTag}`;
  return `${range} reps${sideTag}`;
}

function setsLabel(p) {
  const mod = p.modality || "reps";
  const sets = p.sets.length;
  if (mod === "time")   return `${sets} × ${prescriptionText(p)}`;
  if (mod === "rounds") return `${sets} × ${prescriptionText(p)}`;
  return `${sets} × ${prescriptionText(p)}`;
}

// tone: null (default mute) | "warn" | "accent"
function pill(text, tone) {
  const cls = tone === "warn" ? "pill pill-warn" : tone === "accent" ? "pill pill-accent" : "pill";
  return el("span", { class: cls }, [text]);
}

function howToDisclosure(ex) {
  const wrap = el("div", { class: "mb-3" });
  let open = false;
  const body = el("div", { class: "hidden mt-2" });

  function rebuildBody() {
    body.innerHTML = "";
    const links = referenceLinks(ex);
    const linksRow = el("div", { class: "flex flex-wrap gap-2" });
    links.forEach(link => {
      const icon = link.kind === "video" ? "▶" : "◫";
      const subtitle = link.curated ? "" : " · search";
      linksRow.appendChild(el("a", {
        href: link.url, target: "_blank", rel: "noopener noreferrer",
        class: `inline-flex items-center gap-2 px-3 py-2 rounded-sm ${link.mine ? "bg-accent/10 text-accent ring-1 ring-accent/30" : "bg-surface2 text-ink"} text-sm`
      }, [
        el("span", { class: link.mine ? "" : "text-accent" }, [icon]),
        el("span", {}, [link.label]),
        subtitle ? el("span", { class: "text-mute text-xs" }, [subtitle]) : null
      ]));
    });
    body.appendChild(linksRow);

    // Edit row (paste your own URL)
    const editRow = el("div", { class: "mt-2 flex items-center gap-2" });
    const input = el("input", {
      type: "url", placeholder: "Paste a better YouTube URL",
      value: (STATE.videoOverrides || {})[ex.exerciseId] || "",
      class: "flex-1 bg-surface2 border border-hairline rounded-sm px-3 py-2 text-sm outline-none focus:border-accent"
    });
    const save = el("button", {
      class: "px-3 py-2 rounded-sm text-accent border border-accent text-sm",
      onClick: () => {
        const v = input.value.trim();
        if (v && !isValidYouTubeUrl(v)) { input.classList.add("border-danger"); return; }
        setVideoOverride(ex.exerciseId, v || null);
        rebuildBody();
      }
    }, ["Save"]);
    editRow.appendChild(input);
    editRow.appendChild(save);
    if ((STATE.videoOverrides || {})[ex.exerciseId]) {
      editRow.appendChild(el("button", {
        class: "px-2 py-2 rounded-sm text-mute text-xs",
        onClick: () => { setVideoOverride(ex.exerciseId, null); rebuildBody(); }
      }, ["Clear"]));
    }
    body.appendChild(editRow);
  }

  const caret = el("span", { class: "inline-block w-3 text-center" }, ["▸"]);
  const toggle = el("button", {
    class: "text-xs text-mute hover:text-ink inline-flex items-center gap-1",
    onClick: () => {
      open = !open;
      body.classList.toggle("hidden", !open);
      caret.textContent = open ? "▾" : "▸";
      if (open) rebuildBody();
    }
  });
  toggle.appendChild(caret);
  toggle.appendChild(document.createTextNode(" How to perform"));
  wrap.appendChild(toggle);
  wrap.appendChild(body);
  return wrap;
}

function SetupScreen() {
  let step = 0;
  const draft = {
    goal: STATE.profile.goal,
    phase: STATE.profile.phase,
    frequency: STATE.profile.frequency,
    sessionLength: STATE.profile.sessionLength,
    doingCardio: !(STATE.profile.disabledTypes || []).includes("cardio"),
    equipment: new Set(STATE.profile.equipment),
    contraindications: new Set(STATE.profile.contraindications)
  };

  const wrap = el("div");
  function paint() {
    wrap.innerHTML = "";
    wrap.appendChild(appBar("Setup", {
      back: step > 0 ? () => { step--; paint(); } : null,
      home: false, // gated — must finish onboarding
      right: el("span", { class: "t-meta num text-mute pr-2" }, [`${step+1}/3`])
    }));

    if (step === 0) {
      wrap.appendChild(el("div", { class: "space-y-5" }, [
        el("div", {}, [
          el("label", { class: "block text-sm text-mute mb-2" }, ["Goal"]),
          radioGroup(["recomp","preserve","rebuild"], draft.goal, v => draft.goal = v)
        ]),
        el("div", {}, [
          el("label", { class: "block text-sm text-mute mb-2" }, ["Current phase"]),
          radioGroup(["0","1","2"], String(draft.phase), v => draft.phase = parseInt(v), p => PHASES[p].short)
        ]),
        el("div", { class: "grid grid-cols-2 gap-3" }, [
          el("div", {}, [
            el("label", { class: "block text-sm text-mute mb-2" }, ["Frequency / wk"]),
            numberStepper(draft.frequency, 2, 7, v => draft.frequency = v)
          ]),
          el("div", {}, [
            el("label", { class: "block text-sm text-mute mb-2" }, ["Session length (min)"]),
            numberStepper(draft.sessionLength, 20, 90, v => draft.sessionLength = v, 5)
          ])
        ]),
        el("div", {}, [
          el("label", { class: "block text-sm text-mute mb-2" }, ["Doing cardio?"]),
          radioGroup(["no","yes"], draft.doingCardio ? "yes" : "no", v => { draft.doingCardio = (v === "yes"); }, v => v === "yes" ? "Yes" : "Not yet")
        ])
      ]));
    } else if (step === 1) {
      wrap.appendChild(el("div", { class: "space-y-3" }, [
        el("label", { class: "block text-sm text-mute mb-1" }, ["Equipment available"]),
        chipSelect(DEFAULT_EQUIPMENT, draft.equipment, prettyEquipment)
      ]));
    } else {
      wrap.appendChild(el("div", { class: "space-y-3" }, [
        el("label", { class: "block text-sm text-mute mb-1" }, ["Contraindications"]),
        el("p", { class: "text-xs text-mute mb-2" }, ["These suppress unsafe exercises silently. Skip if none apply."]),
        chipSelect(DEFAULT_CONTRAINDICATIONS, draft.contraindications, prettyContra)
      ]));
    }

    wrap.appendChild(el("div", { class: "fixed left-0 right-0 bottom-0 bg-bg/90 backdrop-blur p-4" }, [
      el("div", { class: "max-w-md mx-auto flex gap-2" }, [
        step > 0 ? el("button", { class: "flex-1 py-3 rounded-md bg-surface2 text-mute", onClick: () => { step--; paint(); } }, ["Back"]) : null,
        el("button", { class: "flex-1 h-12 rounded-sm bg-accent text-accentInk font-semibold text-[17px] tracking-tight active:scale-[.985] active:opacity-90 transition", onClick: () => {
          if (step < 2) { step++; paint(); return; }
          STATE.profile = {
            goal: draft.goal, phase: draft.phase, frequency: draft.frequency, sessionLength: draft.sessionLength,
            equipment: [...draft.equipment], contraindications: [...draft.contraindications],
            disabledTypes: draft.doingCardio ? [] : ["cardio"]
          };
          STATE.setupDone = true;
          STATE.mesocycle.startDate = todayISO();
          STATE.mesocycle.currentWeek = 1;
          saveState();
          navigate("today");
        } }, [step < 2 ? "Next" : "Start training"])
      ])
    ]));
  }
  paint();
  return wrap;
}

function radioGroup(options, value, onChange, labelFn = x => prettyEquipment(x)) {
  const row = el("div", { class: "flex gap-2 flex-wrap" });
  options.forEach(opt => {
    const active = String(opt) === String(value);
    row.appendChild(el("button", {
      class: `px-3 py-2 rounded-sm border ${active ? "border-accent text-accent bg-accent/10" : "border-hairline text-mute"}`,
      onClick: () => { onChange(opt); row.parentElement.parentElement && row.parentElement.replaceChild(radioGroup(options, opt, onChange, labelFn), row); }
    }, [labelFn(opt)]));
  });
  return row;
}

function chipSelect(options, set, labelFn) {
  const row = el("div", { class: "flex flex-wrap gap-2" });
  options.forEach(opt => {
    const active = set.has(opt);
    row.appendChild(el("button", {
      class: `px-3 py-2 rounded-sm border text-sm ${active ? "border-accent text-accent bg-accent/10" : "border-hairline text-mute"}`,
      onClick: (e) => { active ? set.delete(opt) : set.add(opt); e.target.replaceWith(...chipSelect(options, set, labelFn).children); }
    }, [labelFn(opt)]));
  });
  return row;
}

function numberStepper(value, min, max, onChange, step = 1) {
  const wrap = el("div", { class: "flex items-center gap-2 bg-surface2 rounded-sm p-1" });
  const display = el("div", { class: "flex-1 text-center text-lg" }, [String(value)]);
  wrap.appendChild(el("button", { class: "w-10 h-10 rounded-sm bg-surface2", onClick: () => { value = Math.max(min, value - step); onChange(value); display.textContent = String(value); } }, ["−"]));
  wrap.appendChild(display);
  wrap.appendChild(el("button", { class: "w-10 h-10 rounded-sm bg-surface2", onClick: () => { value = Math.min(max, value + step); onChange(value); display.textContent = String(value); } }, ["+"]));
  return wrap;
}

const prettyEquipment = (e) => ({
  adjustable_dumbbells: "Dumbbells", barbell_plates: "Barbell", adjustable_bench: "Bench",
  pull_up_bar: "Pull-up bar", resistance_bands: "Bands", cable_machine: "Cable",
  foam_roller: "Foam roller", yoga_mat: "Yoga mat", bodyweight: "Bodyweight",
  recomp: "Recomp", preserve: "Preserve", rebuild: "Rebuild",
  "0": "Phase 0", "1": "Phase 1", "2": "Phase 2"
}[e] || e);

const prettyType = (t) => ({
  strength: "Strength", mobility: "Mobility", cardio: "Cardio",
  flexibility: "Flexibility", stability: "Stability", power: "Power",
  rehab: "Rehab", warmup: "Warm-up"
}[t] || t);

// Tag → display label. Single source of truth for human-readable
// contraindication strings. Never expose raw tag names to the user.
const prettyContra = (c) => ({
  right_anterior_shoulder: "Right anterior shoulder (subacromial impingement / rotator cuff)",
  right_ankle_insertional_loading: "Right ankle (insertional Achilles tendinosis + plantar fasciitis)"
}[c] || c);

// Reference links — user override beats seed video_url beats search fallback.
function referenceLinks(ex) {
  const out = [];
  const override = (STATE.videoOverrides || {})[ex.exerciseId];
  if (override) {
    out.push({ kind: "video", label: "Watch (your pick)", url: override, curated: true, mine: true });
  } else if (ex.videoUrl) {
    const dur = ex.videoDurationSec ? ` · ${Math.round(ex.videoDurationSec / 60)}m` : "";
    const src = ex.videoSource ? ` · ${ex.videoSource}` : "";
    out.push({ kind: "video", label: `Watch demo${dur}${src}`, url: ex.videoUrl, curated: true });
  } else {
    const q = encodeURIComponent(`${ex.name} how to do form`);
    out.push({ kind: "video", label: "Search YouTube", url: `https://www.youtube.com/results?search_query=${q}`, curated: false });
    const g = encodeURIComponent(`${ex.name} exercise diagram`);
    out.push({ kind: "diagram", label: "Search diagram", url: `https://www.google.com/search?tbm=isch&q=${g}`, curated: false });
  }
  return out;
}

function isValidYouTubeUrl(s) {
  if (!s) return false;
  try {
    const u = new URL(s.trim());
    return /(^|\.)youtube\.com$/.test(u.hostname) || u.hostname === "youtu.be";
  } catch { return false; }
}

function setVideoOverride(exerciseId, url) {
  STATE.videoOverrides = STATE.videoOverrides || {};
  if (url) STATE.videoOverrides[exerciseId] = url;
  else delete STATE.videoOverrides[exerciseId];
  saveState();
}

// Set today's card-type override and regenerate. Use null to clear.
function setTodayCardType(cardType) {
  const today = todayISO();
  if (cardType) {
    STATE.todayOverride = { date: today, cardType };
    // If today was marked rest, removing it makes sense too.
    STATE.restDays = (STATE.restDays || []).filter(d => d !== today);
  } else {
    STATE.todayOverride = null;
  }
  // Drop any cached session for today so the engine regenerates with the override.
  delete STATE.sessions["s_" + today];
  saveState();
}
